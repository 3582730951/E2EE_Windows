name: mi_e2ee_im_app
description: "Cross-platform IM client shell for MI E2EE."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.4
  device_info_plus: ^13.1.0
  riverpod: ^3.2.1
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: SourceHanSansSC
      fonts:
        - asset: assets/fonts/source_han_sans_sc_regular.otf
          weight: 400
        - asset: assets/fonts/source_han_sans_sc_medium.otf
          weight: 500
        - asset: assets/fonts/source_han_sans_sc_semibold.otf
          weight: 600
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/source_sans_3_regular.ttf
          weight: 400
        - asset: assets/fonts/source_sans_3_medium.ttf
          weight: 500
        - asset: assets/fonts/source_sans_3_semibold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono_regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains_mono_medium.ttf
          weight: 500
