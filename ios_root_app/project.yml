name: RootAuthApp
options:
  bundleIdPrefix: mi.e2ee.root
  deploymentTarget:
    iOS: "16.0"
targets:
  RootAuthApp:
    type: application
    platform: iOS
    sources:
      - RootAuthApp
    info:
      path: RootAuthApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mi.e2ee.root.RootAuthApp
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../sdk $(SRCROOT)/../sdk/ios_bridge"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/../sdk/ios_bridge"
        SWIFT_OBJC_BRIDGING_HEADER: RootAuthApp/RootAuthApp-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
