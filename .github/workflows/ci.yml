      - name: Normalize Windows UI smoke screenshots
        if: always()
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import struct
          import shutil
          import zlib
          from pathlib import Path

          def png_chunk(kind: bytes, payload: bytes) -> bytes:
              crc = zlib.crc32(kind + payload) & 0xFFFFFFFF
              return len(payload).to_bytes(4, "big") + kind + payload + crc.to_bytes(4, "big")

          def decode_png_rgba(path: Path):
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  return None
              idx = 8
              idat = bytearray()
              width = height = 0
              bit_depth = color_type = interlace = 0
              while idx + 8 <= len(data):
                  chunk_len = int.from_bytes(data[idx:idx + 4], "big")
                  idx += 4
                  chunk_type = data[idx:idx + 4]
                  idx += 4
                  chunk_data = data[idx:idx + chunk_len]
                  idx += chunk_len
                  idx += 4
                  if chunk_type == b"IHDR":
                      width, height, bit_depth, color_type, _, _, interlace = struct.unpack(">IIBBBBB", chunk_data)
                  elif chunk_type == b"IDAT":
                      idat.extend(chunk_data)
                  elif chunk_type == b"IEND":
                      break
              if not width or not height or bit_depth != 8 or color_type != 6 or interlace != 0:
                  return None
              raw = zlib.decompress(bytes(idat))
              bpp = 4
              stride = width * bpp
              cursor = 0
              prev = bytearray(stride)
              rows = []
              def paeth(a: int, b: int, c: int) -> int:
                  p = a + b - c
                  pa = abs(p - a)
                  pb = abs(p - b)
                  pc = abs(p - c)
                  if pa <= pb and pa <= pc:
                      return a
                  if pb <= pc:
                      return b
                  return c
              for _ in range(height):
                  filter_type = raw[cursor]
                  cursor += 1
                  row = bytearray(raw[cursor:cursor + stride])
                  cursor += stride
                  if filter_type == 1:
                      for x in range(stride):
                          row[x] = (row[x] + (row[x - bpp] if x >= bpp else 0)) & 0xFF
                  elif filter_type == 2:
                      for x in range(stride):
                          row[x] = (row[x] + prev[x]) & 0xFF
                  elif filter_type == 3:
                      for x in range(stride):
                          left = row[x - bpp] if x >= bpp else 0
                          row[x] = (row[x] + ((left + prev[x]) // 2)) & 0xFF
                  elif filter_type == 4:
                      for x in range(stride):
                          left = row[x - bpp] if x >= bpp else 0
                          up = prev[x]
                          up_left = prev[x - bpp] if x >= bpp else 0
                          row[x] = (row[x] + paeth(left, up, up_left)) & 0xFF
                  rows.append(bytes(row))
                  prev = row
              return width, height, rows

          def encode_png_rgba(path: Path, width: int, height: int, rows):
              raw = bytearray()
              for row in rows:
                  raw.append(0)
                  raw.extend(row)
              ihdr = struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)
              body = bytearray()
              body.extend(b"\x89PNG\r\n\x1a\n")
              body.extend(png_chunk(b"IHDR", ihdr))
              body.extend(png_chunk(b"IDAT", zlib.compress(bytes(raw), 9)))
              body.extend(png_chunk(b"IEND", b""))
              path.write_bytes(bytes(body))

          def trim_black_frame(
              path: Path,
              threshold: int = 8,
              pure_ratio_limit: float = 0.995,
              edge_ratio_limit: float = 0.60,
              corner_ratio_limit: float = 0.001,
              side_ratio_limit: float = 0.985,
              min_edge_trim_px: int = 24,
          ):
              decoded = decode_png_rgba(path)
              if decoded is None:
                  return False
              width, height, rows = decoded
              if width < 64 or height < 64:
                  return False

              def row_black_ratio(y: int, left: int = 0, right: int = None) -> float:
                  if right is None:
                      right = width - 1
                  row = rows[y]
                  hits = 0
                  span = right - left + 1
                  for x in range(left, right + 1):
                      o = x * 4
                      if row[o] <= threshold and row[o + 1] <= threshold and row[o + 2] <= threshold:
                          hits += 1
                  return hits / span

              def col_black_ratio(x: int, top: int = 0, bottom: int = None) -> float:
                  if bottom is None:
                      bottom = height - 1
                  hits = 0
                  o = x * 4
                  span = bottom - top + 1
                  for y in range(top, bottom + 1):
                      row = rows[y]
                      if row[o] <= threshold and row[o + 1] <= threshold and row[o + 2] <= threshold:
                          hits += 1
                  return hits / span

              top = 0
              while top < height - 1 and row_black_ratio(top) >= edge_ratio_limit:
                  top += 1
              bottom = height - 1
              while bottom > top and row_black_ratio(bottom) >= edge_ratio_limit:
                  bottom -= 1
              coarse_top_trim = top
              coarse_bottom_trim = (height - 1) - bottom

              # Require meaningful trim on both vertical edges before aggressive cleanup.
              if coarse_top_trim >= min_edge_trim_px and coarse_bottom_trim >= min_edge_trim_px:
                  while top < bottom and row_black_ratio(top) > corner_ratio_limit:
                      top += 1
                  while bottom > top and row_black_ratio(bottom) > corner_ratio_limit:
                      bottom -= 1
                  left = 0
                  while left < width - 1 and col_black_ratio(left, top, bottom) >= side_ratio_limit:
                      left += 1
                  right = width - 1
                  while right > left and col_black_ratio(right, top, bottom) >= side_ratio_limit:
                      right -= 1
              else:
                  top = 0
                  while top < height - 1 and row_black_ratio(top) >= pure_ratio_limit:
                      top += 1
                  bottom = height - 1
                  while bottom > top and row_black_ratio(bottom) >= pure_ratio_limit:
                      bottom -= 1
                  left = 0
                  while left < width - 1 and col_black_ratio(left) >= pure_ratio_limit:
                      left += 1
                  right = width - 1
                  while right > left and col_black_ratio(right) >= pure_ratio_limit:
                      right -= 1

              crop_w = right - left + 1
              crop_h = bottom - top + 1
              if crop_w >= width and crop_h >= height:
                  return False
              if crop_w < int(width * 0.70) or crop_h < int(height * 0.70):
                  return False

              cropped_rows = [rows[y][left * 4:(right + 1) * 4] for y in range(top, bottom + 1)]
              encode_png_rgba(path, crop_w, crop_h, cropped_rows)
              print(f"trimmed {path}: {width}x{height} -> {crop_w}x{crop_h} (l={left}, t={top}, r={width-right-1}, b={height-bottom-1})")
              return True

          roots = [Path("build/ui_smoke_artifacts")]
          canonical_aliases = {
              "login.png": "login-zh-CN-light-100.png",
              "post-login.png": "post-login-zh-CN-light-100.png",
              "chat-detail.png": "chat-detail-zh-CN-light-100.png",
              "calls-home.png": "calls-home-zh-CN-light-100.png",
              "settings-home.png": "settings-home-zh-CN-light-100.png",
              "post-login-light.png": "post-login-light-zh-CN-light-100.png",
              "security-center.png": "security-center-zh-CN-light-100.png",
          }
          for root in roots:
              if not root.exists():
                  continue
              for image in sorted(root.rglob("*.png")):
                  trim_black_frame(image)
              scope_dirs = [root]
              scope_dirs.extend(
                  candidate
                  for candidate in root.rglob("*")
                  if candidate.is_dir()
              )
              for scope in scope_dirs:
                  for alias_name, source_name in canonical_aliases.items():
                      source = scope / source_name
                      if source.exists():
                          shutil.copyfile(source, scope / alias_name)
          '@ | python -

      - name: Write Windows runtime evidence manifest
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import json
          from pathlib import Path

          root = Path("build/ui_smoke_artifacts")
          if not root.exists():
              raise SystemExit("build/ui_smoke_artifacts is missing")

          acceptance = json.loads(Path("ui_contract/acceptance.json").read_text(encoding="utf-8"))
          tuple_entries = acceptance["runtime_artifact_contract"]["tuple_inventory"]["windows"]
          scene_evidence: dict[str, list[str]] = {}
          theme_evidence: dict[str, list[str]] = {}
          state_evidence: dict[str, list[str]] = {}
          tuple_evidence: dict[str, list[str]] = {}

          def extend_unique(target: dict[str, list[str]], key: str, evidence_files: list[str]) -> None:
              bucket = target.setdefault(key, [])
              for rel in evidence_files:
                  if rel not in bucket:
                      bucket.append(rel)

          for entry in tuple_entries:
              scene = entry["scene"]
              theme = entry["theme"]
              state = entry["state"]
              evidence_files = list(entry["evidence_files"])
              tuple_key = f"{scene}|{theme}|{state}"
              tuple_evidence[tuple_key] = evidence_files
              extend_unique(scene_evidence, scene, evidence_files)
              extend_unique(theme_evidence, theme, evidence_files)
              extend_unique(state_evidence, state, evidence_files)
          locale_evidence = [
              "build/post-login-en-US-light-100.png",
              "dist/post-login-en-US-light-100.png",
          ]
          required_files = sorted({
              *(entry for entries in scene_evidence.values() for entry in entries),
              *(entry for entries in theme_evidence.values() for entry in entries),
              *(entry for entries in state_evidence.values() for entry in entries),
              *(entry for entries in tuple_evidence.values() for entry in entries),
              *locale_evidence,
          })
          missing = [entry for entry in required_files if not (root / entry).exists()]
          if missing:
              raise SystemExit("missing Windows runtime evidence files:\n" + "\n".join(str(root / entry) for entry in missing))

          manifest = {
              "platform": "windows",
              "required_evidence_satisfied": [
                  "build",
                  "navigation_flow",
                  "fixture_smoke",
                  "golden_diff",
                  "theme_parity",
                  "packaging",
                  "identity_visuals",
                  "security_tone_matrix",
                  "empty_state_art",
                  "smoke_matrix",
                  "scene_matrix",
                  "viewport_matrix",
                  "tuple_matrix",
              ],
              "theme_matrix_validated": sorted(theme_evidence.keys()),
              "state_matrix_validated": sorted(state_evidence.keys()),
              "scenes_validated": list(scene_evidence.keys()),
              "tuple_matrix_validated": sorted(tuple_evidence.keys()),
              "scene_evidence": scene_evidence,
              "theme_evidence": theme_evidence,
              "state_evidence": state_evidence,
              "tuple_evidence": tuple_evidence,
