          "$server" config.ini >/dev/null 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 20); do
            if "$tool" --host 127.0.0.1 --port "$port" --token "$token" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 0.5
          done
          kill "$pid" >/dev/null 2>&1 || true
