            exit 1
          fi
          xcrun simctl erase "$udid" >/dev/null 2>&1 || true
          xcrun simctl boot "$udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$udid" -b || {
            echo "Simulator boot failed" >&2
            exit 1
          }
          xcrun simctl install "$udid" "$app_path" || {
            echo "Simulator install failed" >&2
            exit 1
          }
          screenshot_is_windowed() {
            local image_path="$1"
            /usr/bin/python3 - "$image_path" <<'PY'
          import struct
          import sys
          import zlib

          path = sys.argv[1]
          data = open(path, "rb").read()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              sys.exit(2)

          idx = 8
          idat = b""
          width = 0
          height = 0
          bit_depth = 0
          color_type = 0
          interlace = 0

          while idx + 8 <= len(data):
              chunk_len = int.from_bytes(data[idx:idx + 4], "big")
              idx += 4
              chunk_type = data[idx:idx + 4]
              idx += 4
              chunk_data = data[idx:idx + chunk_len]
              idx += chunk_len
              idx += 4  # crc
              if chunk_type == b"IHDR":
                  width, height, bit_depth, color_type, _, _, interlace = struct.unpack(">IIBBBBB", chunk_data)
              elif chunk_type == b"IDAT":
                  idat += chunk_data
              elif chunk_type == b"IEND":
                  break

          if not width or not height or bit_depth != 8 or color_type != 6 or interlace != 0:
              sys.exit(2)

          raw = zlib.decompress(idat)
          bytes_per_pixel = 4
          stride = width * bytes_per_pixel

          left_cols = min(48, width)
          right_start = max(0, width - 48)
          left_black = [0] * left_cols
          right_black = [0] * (width - right_start)

          def paeth(a: int, b: int, c: int) -> int:
              p = a + b - c
              pa = abs(p - a)
              pb = abs(p - b)
              pc = abs(p - c)
              if pa <= pb and pa <= pc:
                  return a
              if pb <= pc:
                  return b
              return c

          cursor = 0
          prev = bytearray(stride)
          for _ in range(height):
              f = raw[cursor]
              cursor += 1
              row = bytearray(raw[cursor:cursor + stride])
              cursor += stride
              if f == 1:
                  for x in range(stride):
                      row[x] = (row[x] + (row[x - bytes_per_pixel] if x >= bytes_per_pixel else 0)) & 0xFF
              elif f == 2:
                  for x in range(stride):
                      row[x] = (row[x] + prev[x]) & 0xFF
              elif f == 3:
                  for x in range(stride):
                      left = row[x - bytes_per_pixel] if x >= bytes_per_pixel else 0
                      row[x] = (row[x] + ((left + prev[x]) // 2)) & 0xFF
              elif f == 4:
                  for x in range(stride):
                      left = row[x - bytes_per_pixel] if x >= bytes_per_pixel else 0
                      up = prev[x]
                      up_left = prev[x - bytes_per_pixel] if x >= bytes_per_pixel else 0
                      row[x] = (row[x] + paeth(left, up, up_left)) & 0xFF

              for x in range(left_cols):
                  o = x * bytes_per_pixel
                  if row[o] < 10 and row[o + 1] < 10 and row[o + 2] < 10:
                      left_black[x] += 1

              for i, x in enumerate(range(right_start, width)):
                  o = x * bytes_per_pixel
                  if row[o] < 10 and row[o + 1] < 10 and row[o + 2] < 10:
                      right_black[i] += 1

              prev = row

          left_ratio = max((value / height for value in left_black), default=0.0)
          right_ratio = max((value / height for value in right_black), default=0.0)
          sys.exit(1 if left_ratio > 0.20 or right_ratio > 0.20 else 0)
          PY
          }
          capture_screenshot() {
            local mode="$1"
            local theme="$2"
            local output="$3"
            local settle_seconds=5
            if [ "$mode" = "detail" ] || [ "$mode" = "security" ]; then
              settle_seconds=6
            fi
            xcrun simctl ui "$udid" appearance "$theme" >/dev/null 2>&1 || {
              echo "Failed to set simulator appearance: $theme" >&2
              return 1
            }
            for attempt in 1 2 3; do
              rm -f "$output"
              xcrun simctl terminate "$udid" mi.e2ee.root.RootAuthApp >/dev/null 2>&1 || true
              xcrun simctl keypress "$udid" HOME >/dev/null 2>&1 || true
              xcrun simctl keypress "$udid" HOME >/dev/null 2>&1 || true
              sleep 1
              SIMCTL_CHILD_MI_E2EE_IOS_SCREENSHOT_MODE="$mode" \
                xcrun simctl launch --terminate-running-process "$udid" mi.e2ee.root.RootAuthApp >/dev/null 2>&1 || true
              sleep "$settle_seconds"
              if ! xcrun simctl io "$udid" screenshot "$output"; then
                continue
              fi
              if screenshot_is_windowed "$output"; then
                echo "Detected simulator card/windowed state for mode=$mode (attempt=$attempt), retrying..." >&2
                continue
              fi
              return 0
            done
            return 1
          }
          screenshots_visibly_differ() {
            local first="$1"
            local second="$2"
            /usr/bin/python3 - "$first" "$second" <<'PY'
          import struct
          import sys
          import zlib

          def decode_png_rgba(path: str):
              data = open(path, "rb").read()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  return None

              idx = 8
              idat = bytearray()
              width = 0
              height = 0
              bit_depth = 0
              color_type = 0
              interlace = 0

              while idx + 8 <= len(data):
                  chunk_len = int.from_bytes(data[idx:idx + 4], "big")
                  idx += 4
                  chunk_type = data[idx:idx + 4]
                  idx += 4
                  chunk_data = data[idx:idx + chunk_len]
                  idx += chunk_len
                  idx += 4
                  if chunk_type == b"IHDR":
                      width, height, bit_depth, color_type, _, _, interlace = struct.unpack(">IIBBBBB", chunk_data)
                  elif chunk_type == b"IDAT":
                      idat.extend(chunk_data)
                  elif chunk_type == b"IEND":
                      break

              if not width or not height or bit_depth != 8 or color_type != 6 or interlace != 0:
                  return None

              raw = zlib.decompress(bytes(idat))
              bytes_per_pixel = 4
              stride = width * bytes_per_pixel
              cursor = 0
              prev = bytearray(stride)
              rows = []

              def paeth(a: int, b: int, c: int) -> int:
                  p = a + b - c
                  pa = abs(p - a)
                  pb = abs(p - b)
                  pc = abs(p - c)
                  if pa <= pb and pa <= pc:
                      return a
                  if pb <= pc:
                      return b
                  return c

              for _ in range(height):
                  if cursor >= len(raw):
                      return None
                  filter_type = raw[cursor]
                  cursor += 1
                  row = bytearray(raw[cursor:cursor + stride])
                  if len(row) != stride:
                      return None
                  cursor += stride

                  if filter_type == 1:
                      for x in range(stride):
                          row[x] = (row[x] + (row[x - bytes_per_pixel] if x >= bytes_per_pixel else 0)) & 0xFF
                  elif filter_type == 2:
                      for x in range(stride):
                          row[x] = (row[x] + prev[x]) & 0xFF
                  elif filter_type == 3:
                      for x in range(stride):
                          left = row[x - bytes_per_pixel] if x >= bytes_per_pixel else 0
                          row[x] = (row[x] + ((left + prev[x]) // 2)) & 0xFF
                  elif filter_type == 4:
                      for x in range(stride):
                          left = row[x - bytes_per_pixel] if x >= bytes_per_pixel else 0
                          up = prev[x]
                          up_left = prev[x - bytes_per_pixel] if x >= bytes_per_pixel else 0
                          row[x] = (row[x] + paeth(left, up, up_left)) & 0xFF
                  elif filter_type != 0:
                      return None

                  rows.append(bytes(row))
                  prev = row

              return width, height, rows

          left = decode_png_rgba(sys.argv[1])
          right = decode_png_rgba(sys.argv[2])
          if left is None or right is None:
              sys.exit(1)
          if left[0] != right[0] or left[1] != right[1]:
              sys.exit(0)

          for left_row, right_row in zip(left[2], right[2]):
              for offset in range(0, len(left_row), 4):
                  if left_row[offset:offset + 3] != right_row[offset:offset + 3]:
                      sys.exit(0)

          sys.exit(1)
          PY
          }
          capture_failed=0
          capture_screenshot "login" "light" "build/ios_rootauth_artifacts/rootauth-ios-login.png" || {
            echo "Failed to capture RootAuth iOS screenshot: login" >&2
            capture_failed=1
          }
          capture_screenshot "chats" "light" "build/ios_rootauth_artifacts/rootauth-ios-home.png" || {
            echo "Failed to capture RootAuth iOS screenshot: chats/home" >&2
            capture_failed=1
          }
          capture_screenshot "detail" "light" "build/ios_rootauth_artifacts/rootauth-ios-detail.png" || {
            echo "Failed to capture RootAuth iOS screenshot: detail" >&2
            capture_failed=1
          }
          capture_screenshot "calls" "light" "build/ios_rootauth_artifacts/rootauth-ios-calls.png" || {
            echo "Failed to capture RootAuth iOS screenshot: calls" >&2
            capture_failed=1
          }
          capture_screenshot "settings" "light" "build/ios_rootauth_artifacts/rootauth-ios-settings.png" || {
            echo "Failed to capture RootAuth iOS screenshot: settings" >&2
            capture_failed=1
          }
          capture_screenshot "security" "light" "build/ios_rootauth_artifacts/rootauth-ios-security.png" || {
            echo "Failed to capture RootAuth iOS screenshot: security" >&2
            capture_failed=1
          }
          capture_screenshot "chats" "dark" "build/ios_rootauth_artifacts/rootauth-ios-home-dark.png" || {
            echo "Failed to capture RootAuth iOS screenshot: chats/home (dark)" >&2
            capture_failed=1
          }
          capture_screenshot "security" "dark" "build/ios_rootauth_artifacts/rootauth-ios-security-dark.png" || {
            echo "Failed to capture RootAuth iOS screenshot: security (dark)" >&2
            capture_failed=1
          }
          xcrun simctl ui "$udid" appearance light >/dev/null 2>&1 || true

          required_screenshots=(
            "build/ios_rootauth_artifacts/rootauth-ios-login.png"
            "build/ios_rootauth_artifacts/rootauth-ios-home.png"
            "build/ios_rootauth_artifacts/rootauth-ios-home-dark.png"
            "build/ios_rootauth_artifacts/rootauth-ios-detail.png"
            "build/ios_rootauth_artifacts/rootauth-ios-calls.png"
            "build/ios_rootauth_artifacts/rootauth-ios-settings.png"
            "build/ios_rootauth_artifacts/rootauth-ios-security.png"
            "build/ios_rootauth_artifacts/rootauth-ios-security-dark.png"
          )

          missing_screenshots=0
          for screenshot in "${required_screenshots[@]}"; do
            if [ ! -s "$screenshot" ]; then
              echo "Missing or empty RootAuth iOS screenshot: $screenshot" >&2
              missing_screenshots=1
            fi
          done

          if [ "$capture_failed" -ne 0 ] || [ "$missing_screenshots" -ne 0 ]; then
            echo "RootAuth iOS screenshot capture is incomplete; failing workflow." >&2
            exit 1
          fi

          if ! screenshots_visibly_differ \
            "build/ios_rootauth_artifacts/rootauth-ios-login.png" \
            "build/ios_rootauth_artifacts/rootauth-ios-detail.png"; then
            echo "RootAuth iOS detail screenshot matches login screenshot; failing workflow." >&2
            exit 1
          fi

      - name: Normalize RootAuth iOS screenshots
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import struct
          import zlib
          from pathlib import Path

          def png_chunk(kind: bytes, payload: bytes) -> bytes:
              crc = zlib.crc32(kind + payload) & 0xFFFFFFFF
              return len(payload).to_bytes(4, "big") + kind + payload + crc.to_bytes(4, "big")

          def decode_png_rgba(path: Path):
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  return None
              idx = 8
              idat = bytearray()
              width = height = 0
              bit_depth = color_type = interlace = 0
              while idx + 8 <= len(data):
                  chunk_len = int.from_bytes(data[idx:idx + 4], "big")
                  idx += 4
                  chunk_type = data[idx:idx + 4]
                  idx += 4
                  chunk_data = data[idx:idx + chunk_len]
                  idx += chunk_len
                  idx += 4
                  if chunk_type == b"IHDR":
                      width, height, bit_depth, color_type, _, _, interlace = struct.unpack(">IIBBBBB", chunk_data)
                  elif chunk_type == b"IDAT":
                      idat.extend(chunk_data)
                  elif chunk_type == b"IEND":
                      break
              if not width or not height or bit_depth != 8 or color_type != 6 or interlace != 0:
                  return None
              raw = zlib.decompress(bytes(idat))
              bpp = 4
              stride = width * bpp
              cursor = 0
              prev = bytearray(stride)
              rows = []
              def paeth(a: int, b: int, c: int) -> int:
                  p = a + b - c
                  pa = abs(p - a)
                  pb = abs(p - b)
                  pc = abs(p - c)
                  if pa <= pb and pa <= pc:
                      return a
                  if pb <= pc:
                      return b
                  return c
              for _ in range(height):
                  filter_type = raw[cursor]
                  cursor += 1
                  row = bytearray(raw[cursor:cursor + stride])
                  cursor += stride
                  if filter_type == 1:
                      for x in range(stride):
                          row[x] = (row[x] + (row[x - bpp] if x >= bpp else 0)) & 0xFF
                  elif filter_type == 2:
                      for x in range(stride):
                          row[x] = (row[x] + prev[x]) & 0xFF
                  elif filter_type == 3:
                      for x in range(stride):
                          left = row[x - bpp] if x >= bpp else 0
                          row[x] = (row[x] + ((left + prev[x]) // 2)) & 0xFF
                  elif filter_type == 4:
                      for x in range(stride):
                          left = row[x - bpp] if x >= bpp else 0
                          up = prev[x]
                          up_left = prev[x - bpp] if x >= bpp else 0
                          row[x] = (row[x] + paeth(left, up, up_left)) & 0xFF
                  rows.append(bytes(row))
                  prev = row
              return width, height, rows

          def encode_png_rgba(path: Path, width: int, height: int, rows):
              raw = bytearray()
              for row in rows:
                  raw.append(0)
                  raw.extend(row)
              ihdr = struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)
              body = bytearray()
              body.extend(b"\x89PNG\r\n\x1a\n")
              body.extend(png_chunk(b"IHDR", ihdr))
              body.extend(png_chunk(b"IDAT", zlib.compress(bytes(raw), 9)))
              body.extend(png_chunk(b"IEND", b""))
              path.write_bytes(bytes(body))

          def trim_black_frame(
              path: Path,
              threshold: int = 8,
              ratio_limit: float = 0.995,
              near_edge_search_px: int = 96,
              min_band_height_px: int = 80,
          ):
              decoded = decode_png_rgba(path)
              if decoded is None:
                  return False
              width, height, rows = decoded
              if width < 64 or height < 64:
                  return False
              original_width = width
              original_height = height
              total_left = 0
              total_top = 0
              total_right = 0
              total_bottom = 0
              trimmed = False

              while True:
                  current_width = width
                  current_height = height

                  def row_black_ratio(y: int) -> float:
                      row = rows[y]
                      hits = 0
                      for x in range(current_width):
                          o = x * 4
                          if row[o] <= threshold and row[o + 1] <= threshold and row[o + 2] <= threshold:
                              hits += 1
                      return hits / current_width

                  def col_black_ratio(x: int) -> float:
                      hits = 0
                      o = x * 4
                      for y in range(current_height):
                          row = rows[y]
                          if row[o] <= threshold and row[o + 1] <= threshold and row[o + 2] <= threshold:
                              hits += 1
                      return hits / current_height

                  def find_near_edge_band_from_top():
                      limit = min(current_height - 1, near_edge_search_px)
                      y = 0
                      while y <= limit:
                          if row_black_ratio(y) >= ratio_limit:
                              start = y
                              while y + 1 < current_height and row_black_ratio(y + 1) >= ratio_limit:
                                  y += 1
                              if (y - start + 1) >= min_band_height_px:
                                  return start, y
                          y += 1
                      return None

                  def find_near_edge_band_from_bottom():
                      limit = max(0, current_height - 1 - near_edge_search_px)
                      y = current_height - 1
                      while y >= limit:
                          if row_black_ratio(y) >= ratio_limit:
                              end = y
                              while y - 1 >= 0 and row_black_ratio(y - 1) >= ratio_limit:
                                  y -= 1
                              if (end - y + 1) >= min_band_height_px:
                                  return y, end
                          y -= 1
                      return None

                  top = 0
                  while top < current_height - 1 and row_black_ratio(top) >= ratio_limit:
                      top += 1
                  bottom = current_height - 1
                  while bottom > top and row_black_ratio(bottom) >= ratio_limit:
                      bottom -= 1
                  left = 0
                  while left < current_width - 1 and col_black_ratio(left) >= ratio_limit:
                      left += 1
                  right = current_width - 1
                  while right > left and col_black_ratio(right) >= ratio_limit:
                      right -= 1

                  crop_w = right - left + 1
                  crop_h = bottom - top + 1
                  if crop_w < current_width or crop_h < current_height:
                      if crop_w < int(current_width * 0.70) or crop_h < int(current_height * 0.70):
                          break
                      rows = [rows[y][left * 4:(right + 1) * 4] for y in range(top, bottom + 1)]
                      width = crop_w
                      height = crop_h
                      total_left += left
                      total_top += top
                      total_right += current_width - right - 1
                      total_bottom += current_height - bottom - 1
                      trimmed = True
                      continue

                  top_band = find_near_edge_band_from_top()
                  bottom_band = find_near_edge_band_from_bottom()
                  if top_band is None and bottom_band is None:
                      break

                  top = top_band[1] + 1 if top_band is not None else 0
                  bottom = bottom_band[0] - 1 if bottom_band is not None else current_height - 1
                  if top >= bottom:
                      break

                  crop_h = bottom - top + 1
                  if crop_h < int(current_height * 0.70):
                      break

                  rows = rows[top:bottom + 1]
                  height = crop_h
                  total_top += top
                  total_bottom += current_height - bottom - 1
                  trimmed = True

              if not trimmed:
                  return False

              encode_png_rgba(path, width, height, rows)
              print(
                  f"trimmed {path}: {original_width}x{original_height} -> {width}x{height} "
                  f"(l={total_left}, t={total_top}, r={total_right}, b={total_bottom})"
              )
              return True

          for file_path in sorted(glob.glob("build/ios_rootauth_artifacts/rootauth-ios-*.png")):
              trim_black_frame(Path(file_path))
          PY

      - name: Write RootAuth iOS runtime evidence manifest
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/ios_rootauth_artifacts")
          required = {
              "login": root / "rootauth-ios-login.png",
              "chats": root / "rootauth-ios-home.png",
              "detail": root / "rootauth-ios-detail.png",
              "calls": root / "rootauth-ios-calls.png",
              "settings": root / "rootauth-ios-settings.png",
              "security": root / "rootauth-ios-security.png",
              "chats_dark": root / "rootauth-ios-home-dark.png",
              "security_dark": root / "rootauth-ios-security-dark.png",
          }
          missing = [str(path) for path in required.values() if not path.exists()]
          bundle = root / "RootAuthApp-sim.zip"
          if not bundle.exists():
              missing.append(str(bundle))
          if missing:
              raise SystemExit("missing iOS runtime evidence files:\n" + "\n".join(missing))

          acceptance = json.loads(Path("ui_contract/acceptance.json").read_text(encoding="utf-8"))
          tuple_entries = acceptance["runtime_artifact_contract"]["tuple_inventory"]["ios"]
          scene_evidence: dict[str, list[str]] = {}
          theme_evidence: dict[str, list[str]] = {}
          state_evidence: dict[str, list[str]] = {}
          tuple_evidence: dict[str, list[str]] = {}

          def extend_unique(target: dict[str, list[str]], key: str, evidence_files: list[str]) -> None:
              bucket = target.setdefault(key, [])
              for rel in evidence_files:
                  if rel not in bucket:
                      bucket.append(rel)

          for entry in tuple_entries:
              scene = entry["scene"]
              theme = entry["theme"]
              state = entry["state"]
              evidence_files = list(entry["evidence_files"])
              tuple_key = f"{scene}|{theme}|{state}"
              tuple_evidence[tuple_key] = evidence_files
              extend_unique(scene_evidence, scene, evidence_files)
              extend_unique(theme_evidence, theme, evidence_files)
              extend_unique(state_evidence, state, evidence_files)
          required_files = sorted({
              *(entry for entries in scene_evidence.values() for entry in entries),
              *(entry for entries in theme_evidence.values() for entry in entries),
              *(entry for entries in state_evidence.values() for entry in entries),
              *(entry for entries in tuple_evidence.values() for entry in entries),
          })
          tuple_missing = [entry for entry in required_files if not (root / entry).exists()]
          if tuple_missing:
              raise SystemExit("missing iOS tuple runtime evidence files:\n" + "\n".join(tuple_missing))

          manifest = {
              "platform": "ios",
              "required_evidence_satisfied": [
                  "build",
                  "navigation_flow",
                  "fixture_smoke",
                  "theme_parity",
                  "identity_visuals",
                  "security_tone_matrix",
                  "empty_state_art",
                  "detail_tab_hidden_parity",
                  "scene_matrix",
                  "viewport_matrix",
                  "tuple_matrix",
              ],
              "theme_matrix_validated": sorted(theme_evidence.keys()),
              "state_matrix_validated": sorted(state_evidence.keys()),
              "scenes_validated": list(scene_evidence.keys()),
              "tuple_matrix_validated": sorted(tuple_evidence.keys()),
              "scene_evidence": scene_evidence,
              "theme_evidence": theme_evidence,
              "state_evidence": state_evidence,
              "tuple_evidence": tuple_evidence,
          }
          (root / "ios-runtime-evidence.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          for theme in manifest["theme_matrix_validated"]:
              evidence_files = theme_evidence[theme]
              (root / f"ios-theme-{theme}.json").write_text(
                  json.dumps(
                      {"platform": "ios", "theme": theme, "evidence_files": evidence_files},
                      indent=2,
                      ensure_ascii=False,
                  ) + "\n",
                  encoding="utf-8",
              )
          for scene in manifest["scenes_validated"]:
              evidence_files = scene_evidence[scene]
              (root / f"ios-scene-{scene}.json").write_text(
                  json.dumps(
                      {"platform": "ios", "scene": scene, "evidence_files": evidence_files},
                      indent=2,
                      ensure_ascii=False,
                  ) + "\n",
                  encoding="utf-8",
              )
          for state in manifest["state_matrix_validated"]:
              evidence_files = state_evidence[state]
              (root / f"ios-state-{state}.json").write_text(
                  json.dumps(
                      {"platform": "ios", "state": state, "evidence_files": evidence_files},
                      indent=2,
                      ensure_ascii=False,
                  ) + "\n",
                  encoding="utf-8",
              )
          for tuple_key in manifest["tuple_matrix_validated"]:
              scene, theme, state = tuple_key.split("|", 2)
              evidence_files = tuple_evidence[tuple_key]
              marker_name = f"ios-tuple-{scene}__{theme}__{state}.json"
              (root / marker_name).write_text(
                  json.dumps(
                      {
                          "platform": "ios",
                          "scene": scene,
                          "theme": theme,
                          "state": state,
                          "tuple_key": tuple_key,
                          "evidence_files": evidence_files,
                      },
                      indent=2,
                      ensure_ascii=False,
                  ) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Upload RootAuth iOS privacy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi_e2ee_ios_rootauth_privacy_evidence
          path: |
            build/ios_rootauth_artifacts/RootAuthApp-sim.zip
            build/ios_rootauth_artifacts/rootauth-ios-*.png
            build/ios_rootauth_artifacts/ios-*.json
          if-no-files-found: ignore

  build-android:
    needs:
      - verify-ui-contract
    runs-on: ubuntu-latest
    outputs:
      emulator_validated: ${{ steps.android_emulator_validation.outputs.validated }}
      arm64_validated: ${{ steps.android_arm64_validation.outputs.validated }}
      arm64_waived: ${{ steps.android_arm64_validation.outputs.waived }}
      arm64_waiver_reason: ${{ steps.android_arm64_validation.outputs.waiver_reason }}
      arm64_gate_passed: ${{ steps.android_arm64_validation.outputs.gate_passed }}
    defaults:
      run:
        shell: bash
    env:
      MI_E2EE_ANDROID_OLLVM: ${{ vars.MI_E2EE_ANDROID_OLLVM || '1' }}
      MI_E2EE_OLLVM_URL_TEMPLATE: ${{ vars.MI_E2EE_OLLVM_URL_TEMPLATE || '' }}
      MI_E2EE_ANDROID_NDK_VERSION: ${{ vars.MI_E2EE_ANDROID_NDK_VERSION || '25.2.9519653' }}
      MI_E2EE_OLLVM_FALLBACK_URL: ${{ vars.MI_E2EE_OLLVM_FALLBACK_URL || 'https://github.com/codetronik/ollvm-ndk/releases/download/r23c-release/clang' }}
      MI_E2EE_ANDROID_ABIS: ${{ vars.MI_E2EE_ANDROID_ABIS || 'arm64-v8a x86_64' }}
      MI_E2EE_ANDROID_USE_OPENSSL: "1"
      MI_E2EE_ANDROID_ALLOW_TLS_STUB: "0"
      MI_E2EE_OPAQUE_LIB: ${{ vars.MI_E2EE_OPAQUE_LIB || '' }}
      MI_E2EE_OPAQUE_LIB_ROOT: ${{ vars.MI_E2EE_OPAQUE_LIB_ROOT || '' }}
      MI_E2EE_ANDROID_OPENSSL_VERSION: ${{ vars.MI_E2EE_ANDROID_OPENSSL_VERSION || '3.3.2' }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_RESULTS_BUCKET: ${{ secrets.GCP_RESULTS_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/cmake \
            /usr/local/lib/android/sdk/build-tools
          df -h

      - name: Install OLLVM host deps
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y libtinfo5 libncurses5 libc++1 libc++abi1; then
            sudo apt-get install -y libtinfo6 libncurses6 libc++1 libc++abi1
          fi

      - name: Install Android components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-33" "build-tools;34.0.0" "cmake;3.22.1" "ndk;${MI_E2EE_ANDROID_NDK_VERSION}"

      - name: Resolve Android NDK root
        run: |
          set -euo pipefail
          NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$MI_E2EE_ANDROID_NDK_VERSION"
          if [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT=$(ls -d "$ANDROID_SDK_ROOT/ndk/"* 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            echo "NDK not found under $ANDROID_SDK_ROOT/ndk" >&2
            exit 1
          fi
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> $GITHUB_ENV

      - name: Prepare Android OPAQUE libraries
        run: |
          set -euo pipefail
          if [ -n "${MI_E2EE_OPAQUE_LIB:-}" ]; then
            if [ ! -f "${MI_E2EE_OPAQUE_LIB}" ]; then
              echo "::error::MI_E2EE_OPAQUE_LIB points to a missing file: ${MI_E2EE_OPAQUE_LIB}"
              exit 1
            fi
            echo "Using single OPAQUE library: ${MI_E2EE_OPAQUE_LIB}"
            exit 0
          fi
          OPAQUE_ROOT="${MI_E2EE_OPAQUE_LIB_ROOT:-$GITHUB_WORKSPACE/build/opaque/android}"
          if [ ! -d "$OPAQUE_ROOT" ]; then
            chmod +x tools/build_android_opaque.sh
            tools/build_android_opaque.sh \
              --out "$OPAQUE_ROOT" \
              --abis "$MI_E2EE_ANDROID_ABIS" \
              --profile release
          fi
          abis=$(echo "${MI_E2EE_ANDROID_ABIS}" | tr ',;' ' ')
          for abi in $abis; do
            lib="$OPAQUE_ROOT/$abi/libmi_opaque_pake.a"
            if [ ! -f "$lib" ]; then
              echo "::error::Missing Android OPAQUE static lib for $abi: $lib"
              exit 1
            fi
          done
          echo "MI_E2EE_OPAQUE_LIB_ROOT=$OPAQUE_ROOT" >> $GITHUB_ENV

      - name: Build OpenSSL for Android
        run: |
          set -euo pipefail
          chmod +x tools/build_android_openssl.sh
          ABI_ARGS=()
          if [ -n "${MI_E2EE_ANDROID_ABIS:-}" ]; then
            ABI_ARGS=(--abis "${MI_E2EE_ANDROID_ABIS}")
          fi
          tools/build_android_openssl.sh \
            --ndk "$ANDROID_NDK_ROOT" \
            --out "$GITHUB_WORKSPACE/build/openssl/android" \
            --version "$MI_E2EE_ANDROID_OPENSSL_VERSION" \
            --api 24 \
            "${ABI_ARGS[@]}"
          echo "MI_E2EE_ANDROID_OPENSSL_ROOT=$GITHUB_WORKSPACE/build/openssl/android" >> $GITHUB_ENV

      - name: Prepare OLLVM URL
        if: env.MI_E2EE_ANDROID_OLLVM == '1' || env.MI_E2EE_ANDROID_OLLVM == 'true'
        run: |
          set -euo pipefail
          NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$MI_E2EE_ANDROID_NDK_VERSION"
          if [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT=$(ls -d "$ANDROID_SDK_ROOT/ndk/"* 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_ROOT" ]; then
            echo "NDK not found under $ANDROID_SDK_ROOT/ndk" >&2
            exit 1
          fi
          CLANG_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          if [ ! -x "$CLANG_BIN" ]; then
            echo "clang not found: $CLANG_BIN" >&2
            exit 1
          fi
          LLVM_FULL=$("$CLANG_BIN" --version | head -n 1 | sed -E 's/.*clang version ([0-9]+\\.[0-9]+\\.[0-9]+).*/\\1/')
          if [ -z "$LLVM_FULL" ]; then
            echo "Failed to parse clang version from $CLANG_BIN" >&2
            exit 1
          fi
          LLVM_MAJOR=$(echo "$LLVM_FULL" | cut -d. -f1)
          NDK_REV=$(grep -E '^Pkg.Revision' "$NDK_ROOT/source.properties" | cut -d= -f2 | tr -d ' ')
          URL=""
          if [ -n "${MI_E2EE_OLLVM_URL_TEMPLATE:-}" ]; then
            URL="$MI_E2EE_OLLVM_URL_TEMPLATE"
            URL="${URL//\\{LLVM_FULL\\}/$LLVM_FULL}"
            URL="${URL//\\{LLVM_MAJOR\\}/$LLVM_MAJOR}"
          else
            OLLVM_NDK_TAG=""
            case "$NDK_REV" in
              25.2.*) OLLVM_NDK_TAG="r25c" ;;
              26.*) OLLVM_NDK_TAG="r26d" ;;
              23.2.*) OLLVM_NDK_TAG="r23c" ;;
            esac
            if [ -z "$OLLVM_NDK_TAG" ]; then
              echo "Unsupported NDK revision for default OLLVM mapping: $NDK_REV" >&2
              echo "Set MI_E2EE_OLLVM_URL_TEMPLATE to override." >&2
              exit 1
            fi
            URL="https://github.com/Saint-Theana/ollvm-ndk-android/releases/download/0.0/android-ndk-${OLLVM_NDK_TAG}-linux.tar.gz"
            if ! curl -sfI "$URL" >/dev/null; then
              URL="https://github.com/Saint-Theana/ollvm-ndk-android/releases/download/0.0/android-ndk-${OLLVM_NDK_TAG}-android.tar.gz"
            fi
          fi
          if [ -z "$URL" ]; then
            echo "OLLVM URL is empty" >&2
            exit 1
          fi
          mkdir -p build/ollvm
          echo "$NDK_REV|$LLVM_FULL|$URL" > build/ollvm/cache_key.txt
          echo "NDK_REV=$NDK_REV" >> $GITHUB_ENV
          echo "OLLVM_URL=$URL" >> $GITHUB_ENV

      - name: Cache OLLVM download
        if: env.MI_E2EE_ANDROID_OLLVM == '1' || env.MI_E2EE_ANDROID_OLLVM == 'true'
        uses: actions/cache@v4
        with:
          path: build/ollvm/ollvm.tar.gz
          key: ollvm-${{ runner.os }}-${{ hashFiles('build/ollvm/cache_key.txt') }}

      - name: Fetch OLLVM toolchain
        if: env.MI_E2EE_ANDROID_OLLVM == '1' || env.MI_E2EE_ANDROID_OLLVM == 'true'
        run: |
          set -euo pipefail
          OLLVM_VALID=1
          if [ -z "${OLLVM_URL:-}" ]; then
            echo "OLLVM_URL not set. Falling back to standalone OLLVM clang." >&2
            OLLVM_VALID=0
          else
            echo "Using OLLVM URL: $OLLVM_URL"
            mkdir -p build/ollvm
            if [ ! -f build/ollvm/ollvm.tar.gz ]; then
              curl -L "$OLLVM_URL" -o build/ollvm/ollvm.tar.gz
            fi
            tar -xf build/ollvm/ollvm.tar.gz -C build/ollvm
            OLLVM_NDK_ROOT=$(find build/ollvm -type f -name source.properties -print -quit | xargs -r dirname)
            if [ -z "$OLLVM_NDK_ROOT" ]; then
              echo "OLLVM NDK root not found in build/ollvm" >&2
              OLLVM_VALID=0
            else
              OLLVM_CLANG="$OLLVM_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
              OLLVM_CLANGXX="$OLLVM_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
              if [ ! -x "$OLLVM_CLANG" ] || [ ! -x "$OLLVM_CLANGXX" ]; then
                echo "OLLVM clang binaries not found in $OLLVM_NDK_ROOT" >&2
                OLLVM_VALID=0
              fi
            fi
          fi
          if [ "$OLLVM_VALID" = "1" ]; then
            if ! "$OLLVM_CLANG" --version >/dev/null 2>&1; then
              echo "OLLVM clang is not runnable on this runner. Falling back." >&2
              OLLVM_VALID=0
            fi
          fi
          if [ "$OLLVM_VALID" = "1" ]; then
            OLLVM_CLANG=$(realpath "$OLLVM_CLANG")
            OLLVM_CLANGXX=$(realpath "$OLLVM_CLANGXX")
            OLLVM_NDK_ROOT=$(realpath "$OLLVM_NDK_ROOT")
            echo "MI_E2EE_OLLVM_CLANG=$OLLVM_CLANG" >> $GITHUB_ENV
            echo "MI_E2EE_OLLVM_CLANGXX=$OLLVM_CLANGXX" >> $GITHUB_ENV
            echo "MI_E2EE_OLLVM_NDK=$OLLVM_NDK_ROOT" >> $GITHUB_ENV
          else
            FALLBACK_URL="${MI_E2EE_OLLVM_FALLBACK_URL}"
            FALLBACK_DIR="build/ollvm/fallback/bin"
            mkdir -p "$FALLBACK_DIR"
            curl -L "$FALLBACK_URL" -o "$FALLBACK_DIR/clang"
            chmod +x "$FALLBACK_DIR/clang"
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'DIR=$(cd "$(dirname "$0")" && pwd)' \
              'exec "$DIR/clang" --driver-mode=g++ "$@"' \
              > "$FALLBACK_DIR/clang++"
            chmod +x "$FALLBACK_DIR/clang++"
            clang_error="$RUNNER_TEMP/mi-e2ee-ollvm-clang-error"
            if ! "$FALLBACK_DIR/clang" --version >/dev/null 2>"$clang_error"; then
              echo "Fallback OLLVM clang is not runnable on this runner." >&2
              cat "$clang_error" >&2 || true
              file "$FALLBACK_DIR/clang" >&2 || true
              ldd "$FALLBACK_DIR/clang" >&2 || true
              exit 1
            fi
            OLLVM_CLANG=$(realpath "$FALLBACK_DIR/clang")
            OLLVM_CLANGXX=$(realpath "$FALLBACK_DIR/clang++")
            echo "MI_E2EE_OLLVM_CLANG=$OLLVM_CLANG" >> $GITHUB_ENV
            echo "MI_E2EE_OLLVM_CLANGXX=$OLLVM_CLANGXX" >> $GITHUB_ENV
            echo "MI_E2EE_OLLVM_NDK=" >> $GITHUB_ENV
            echo "MI_E2EE_OLLVM_FALLBACK=1" >> $GITHUB_ENV
          fi

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Android debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug :rootapp:assembleDebug -PmiE2eeOpaque=true --no-daemon

      - name: Verify Android artifacts
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apk" ]; then
            echo "debug apk missing: $apk" >&2
            exit 1
          fi
          root_apk="android/rootapp/build/outputs/apk/debug/rootapp-debug.apk"
          if [ ! -f "$root_apk" ]; then
            echo "rootapp debug apk missing: $root_apk" >&2
            exit 1
          fi
          abis="${MI_E2EE_ANDROID_ABIS:-armeabi-v7a arm64-v8a x86 x86_64}"
          abis=$(echo "$abis" | tr ',;' ' ')
          for abi in $abis; do
            for lib in libmi_e2ee_backend.so libmi_e2ee_jni.so; do
              if ! unzip -l "$apk" | grep -q "lib/${abi}/${lib}$"; then
                echo "missing ${lib} for ${abi}" >&2
                exit 1
              fi
            done
          done

      - name: Enable KVM
        if: env.MI_E2EE_CI_SKIP_ANDROID_TESTS != '1'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests (x86_64 api33)
        if: env.MI_E2EE_CI_SKIP_ANDROID_TESTS != '1'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 600
          script: bash ./android/scripts/ci_ui_smoke.sh

      - name: Cleanup Android emulator image (api33)
        if: always()
        run: |
          sdkmanager --uninstall "system-images;android-33;google_apis;x86_64" || true

      - name: Mark Android emulator validation
        id: android_emulator_validation
        if: env.MI_E2EE_CI_SKIP_ANDROID_TESTS != '1'
        run: |
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Auth to Google Cloud
        if: ${{ env.MI_E2EE_CI_SKIP_ANDROID_TESTS != '1' && env.GCP_SERVICE_ACCOUNT_JSON != '' && env.GCP_PROJECT_ID != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Setup gcloud
        if: ${{ env.MI_E2EE_CI_SKIP_ANDROID_TESTS != '1' && env.GCP_SERVICE_ACCOUNT_JSON != '' && env.GCP_PROJECT_ID != '' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: 'firebase'

      - name: Firebase Test Lab (arm64)
        id: android_arm64_ftl
        if: ${{ env.MI_E2EE_CI_SKIP_ANDROID_TESTS != '1' && env.GCP_SERVICE_ACCOUNT_JSON != '' && env.GCP_PROJECT_ID != '' }}
        env:
          FTL_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          FTL_RESULTS_BUCKET: ${{ env.GCP_RESULTS_BUCKET }}
          FTL_DEVICE_MATRIX: ${{ vars.MI_E2EE_FTL_DEVICE_MATRIX }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:assembleDebugAndroidTest -PmiE2eeOpaque=true --no-daemon
          app_apk="app/build/outputs/apk/debug/app-debug.apk"
          test_apk="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          if [ ! -f "$app_apk" ] || [ ! -f "$test_apk" ]; then
            echo "Firebase Test Lab artifacts missing" >&2
            exit 1
          fi
          args=(firebase test android run --type instrumentation --app "$app_apk" --test "$test_apk" --timeout 15m --project "$FTL_PROJECT_ID")
          if [ -n "${FTL_RESULTS_BUCKET:-}" ]; then
            args+=(--results-bucket "$FTL_RESULTS_BUCKET")
          fi
          if [ -n "${FTL_DEVICE_MATRIX:-}" ]; then
            IFS=';' read -r -a devices <<< "$FTL_DEVICE_MATRIX"
            for device in "${devices[@]}"; do
              if [ -n "$device" ]; then
                args+=(--device "$device")
              fi
            done
          else
            args+=(--device "model=Pixel2,version=30,locale=en,orientation=portrait")
            args+=(--device "model=Pixel3,version=33,locale=en,orientation=portrait")
          fi
          gcloud "${args[@]}"
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Mark Android arm64 validation
        id: android_arm64_validation
        if: always()
        env:
          FTL_VALIDATED: ${{ steps.android_arm64_ftl.outputs.validated }}
          FTL_DEVICE_MATRIX: ${{ vars.MI_E2EE_FTL_DEVICE_MATRIX }}
        run: |
          set -euo pipefail
          mkdir -p build/android_ui_artifacts
          validated=false
          waived=false
          waiver_reason=""
          reason_detail="Firebase Test Lab arm64 validation did not run"
          evidence_source="unresolved"
          gate_passed=false
          skip_android_tests=false
          has_gcp_service_account_json=false
          has_gcp_project_id=false
          ftl_validated_reported=false
          ftl_requested_device_matrix_non_empty=false
          ftl_device_matrix_arm64_approved=false
          default_device_matrix="model=Pixel2,version=30,locale=en,orientation=portrait;model=Pixel3,version=33,locale=en,orientation=portrait"
          requested_device_matrix="${FTL_DEVICE_MATRIX:-$default_device_matrix}"
          if [ "${MI_E2EE_CI_SKIP_ANDROID_TESTS:-0}" = "1" ]; then
            skip_android_tests=true
          fi
          if [ "${GCP_SERVICE_ACCOUNT_JSON:-}" != "" ]; then
            has_gcp_service_account_json=true
          fi
          if [ "${GCP_PROJECT_ID:-}" != "" ]; then
            has_gcp_project_id=true
          fi
          if [ "${FTL_VALIDATED:-}" = "true" ]; then
            ftl_validated_reported=true
          fi
          if [ -n "$requested_device_matrix" ]; then
            ftl_requested_device_matrix_non_empty=true
            ftl_device_matrix_arm64_approved=true
            IFS=';' read -r -a requested_devices <<< "$requested_device_matrix"
            for device in "${requested_devices[@]}"; do
              [ -n "$device" ] || continue
              model=""
              IFS=',' read -r -a device_parts <<< "$device"
              for part in "${device_parts[@]}"; do
                case "$part" in
                  model=*)
                    model="${part#model=}"
                    ;;
                esac
              done
              case "$model" in
                Pixel2|Pixel3)
                  ;;
                *)
                  ftl_device_matrix_arm64_approved=false
                  ;;
              esac
            done
          fi
          if [ "${MI_E2EE_CI_SKIP_ANDROID_TESTS:-0}" = "1" ]; then
            waived=true
            waiver_reason="android_tests_skipped"
            reason_detail="Android tests were skipped"
            evidence_source="ci_waiver"
            gate_passed=true
          elif [ "${GCP_SERVICE_ACCOUNT_JSON:-}" = "" ] || [ "${GCP_PROJECT_ID:-}" = "" ]; then
            waived=true
            waiver_reason="missing_gcp_credentials"
            reason_detail="GCP credentials for arm64 validation are missing"
            evidence_source="ci_waiver"
            gate_passed=true
          elif [ "$ftl_device_matrix_arm64_approved" != "true" ]; then
            reason_detail="Firebase Test Lab arm64 device matrix is not approved"
          elif [ "${FTL_VALIDATED:-}" = "true" ]; then
            validated=true
            reason_detail="Firebase Test Lab arm64 validation passed"
            evidence_source="firebase_test_lab"
            gate_passed=true
          else
            reason_detail="Firebase Test Lab arm64 validation failed or did not report success"
          fi
          export ANDROID_ARM64_VALIDATED_VALUE="$validated"
          export ANDROID_ARM64_WAIVED_VALUE="$waived"
          export ANDROID_ARM64_WAIVER_REASON="$waiver_reason"
          export ANDROID_ARM64_REASON_DETAIL="$reason_detail"
          export ANDROID_ARM64_EVIDENCE_SOURCE="$evidence_source"
          export ANDROID_ARM64_GATE_PASSED="$gate_passed"
          export ANDROID_ARM64_SKIP_ANDROID_TESTS="$skip_android_tests"
          export ANDROID_ARM64_HAS_GCP_SERVICE_ACCOUNT_JSON="$has_gcp_service_account_json"
          export ANDROID_ARM64_HAS_GCP_PROJECT_ID="$has_gcp_project_id"
          export ANDROID_ARM64_FTL_VALIDATED_REPORTED="$ftl_validated_reported"
          export ANDROID_ARM64_FTL_REQUESTED_DEVICE_MATRIX_NON_EMPTY="$ftl_requested_device_matrix_non_empty"
          export ANDROID_ARM64_FTL_DEVICE_MATRIX_ARM64_APPROVED="$ftl_device_matrix_arm64_approved"
          export ANDROID_ARM64_REQUESTED_DEVICE_MATRIX="$requested_device_matrix"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          requested_device_matrix = [
              entry for entry in os.environ["ANDROID_ARM64_REQUESTED_DEVICE_MATRIX"].split(";") if entry
          ]
          manifest = {
              "platform": "android",
              "requirement_mode": "required_or_waived",
              "validated": os.environ["ANDROID_ARM64_VALIDATED_VALUE"] == "true",
              "waived": os.environ["ANDROID_ARM64_WAIVED_VALUE"] == "true",
              "waiver_reason": os.environ["ANDROID_ARM64_WAIVER_REASON"],
              "reason_detail": os.environ["ANDROID_ARM64_REASON_DETAIL"],
              "evidence_source": os.environ["ANDROID_ARM64_EVIDENCE_SOURCE"],
              "gate_passed": os.environ["ANDROID_ARM64_GATE_PASSED"] == "true",
              "requested_device_matrix": requested_device_matrix,
              "privacy_evidence": {
                  "skip_android_tests": os.environ["ANDROID_ARM64_SKIP_ANDROID_TESTS"] == "true",
                  "has_gcp_service_account_json": os.environ["ANDROID_ARM64_HAS_GCP_SERVICE_ACCOUNT_JSON"] == "true",
                  "has_gcp_project_id": os.environ["ANDROID_ARM64_HAS_GCP_PROJECT_ID"] == "true",
                  "ftl_validated_reported": os.environ["ANDROID_ARM64_FTL_VALIDATED_REPORTED"] == "true",
                  "ftl_requested_device_matrix_non_empty": os.environ["ANDROID_ARM64_FTL_REQUESTED_DEVICE_MATRIX_NON_EMPTY"] == "true",
                  "ftl_device_matrix_arm64_approved": os.environ["ANDROID_ARM64_FTL_DEVICE_MATRIX_ARM64_APPROVED"] == "true",
              },
          }
          Path("build/android_ui_artifacts/android-arm64-validation.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          echo "validated=$validated" >> "$GITHUB_OUTPUT"
          echo "waived=$waived" >> "$GITHUB_OUTPUT"
          echo "waiver_reason=$waiver_reason" >> "$GITHUB_OUTPUT"
          echo "gate_passed=$gate_passed" >> "$GITHUB_OUTPUT"

      - name: Build Android release
        run: |
          chmod +x android/gradlew
          cd android
          OLLVM_ARGS=()
          if [ "${MI_E2EE_ANDROID_OLLVM}" = "1" ] || [ "${MI_E2EE_ANDROID_OLLVM}" = "true" ]; then
            OLLVM_ARGS+=("-PmiE2eeOllvm=true")
            OLLVM_ARGS+=("-PmiE2eeOllvmClang=${MI_E2EE_OLLVM_CLANG}")
            OLLVM_ARGS+=("-PmiE2eeOllvmClangxx=${MI_E2EE_OLLVM_CLANGXX}")
          fi
          ./gradlew :app:assembleRelease :rootapp:assembleRelease -PmiE2eeOpaque=true "${OLLVM_ARGS[@]}" --no-daemon

      - name: Verify Android release privacy
        run: |
          set -euo pipefail
          for apk in android/app/build/outputs/apk/release/*.apk android/rootapp/build/outputs/apk/release/*.apk; do
            test -f "$apk"
            entries="$(unzip -Z1 "$apk")"
            if printf '%s\n' "$entries" | grep -Eiq '(^|/)([^/]*[.]log([^/]*)?|[^/]*(audit|diagnostic|diagnostics|telemetry|ops_health|crash)[^/]*)$'; then
              echo "Android release package contains a forbidden privacy artifact name" >&2
              exit 1
            fi
            tmp="$(mktemp -d)"
            unzip -qq "$apk" 'classes*.dex' 'lib/*/*.so' -d "$tmp"
            if find "$tmp" -type f -print0 | xargs -0 strings -a | grep -Eai '\b(audit|diagnostic|diagnostics|telemetry|ops_health|crash dump|crash report)\b' >/dev/null; then
              rm -rf "$tmp"
              echo "Android release package contains forbidden privacy runtime strings" >&2
              exit 1
            fi
            rm -rf "$tmp"
          done

      - name: Upload Android debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi_e2ee_android_debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Android rootauth debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi_e2ee_android_rootauth_debug
          path: android/rootapp/build/outputs/apk/debug/*.apk

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi_e2ee_android_release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Android rootauth release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi_e2ee_android_rootauth_release
          path: android/rootapp/build/outputs/apk/release/*.apk

      - name: Verify and finalize Android runtime evidence manifest
        if: always()
        env:
          ANDROID_EMULATOR_VALIDATED: ${{ steps.android_emulator_validation.outputs.validated }}
          ANDROID_ARM64_VALIDATED: ${{ steps.android_arm64_validation.outputs.validated }}
          ANDROID_ARM64_WAIVED: ${{ steps.android_arm64_validation.outputs.waived }}
          ANDROID_ARM64_WAIVER_REASON: ${{ steps.android_arm64_validation.outputs.waiver_reason }}
          ANDROID_ARM64_GATE_PASSED: ${{ steps.android_arm64_validation.outputs.gate_passed }}
        run: |
          set -euo pipefail
          mkdir -p build/android_ui_artifacts
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("build/android_ui_artifacts")
          required = {
              "login": root / "android-login.png",
              "chats": root / "android-chats.png",
              "chats_dark": root / "android-chats-dark.png",
              "detail": root / "android-detail.png",
              "calls": root / "android-calls.png",
              "settings": root / "android-settings.png",
              "security_center": root / "android-security.png",
              "security_center_dark": root / "android-security-dark.png",
          }
          missing = [str(path) for path in required.values() if not path.exists()]
          if missing:
              raise SystemExit("missing Android runtime evidence files:\n" + "\n".join(missing))

          acceptance = json.loads(Path("ui_contract/acceptance.json").read_text(encoding="utf-8"))
          runtime = acceptance["runtime_artifact_contract"]
          android_cfg = runtime["evidence_manifests"]["android_runtime"]
          tuple_entries = runtime["tuple_inventory"]["android"]
          expected_theme_matrix = set(acceptance["theme_matrix"])
          expected_state_matrix = set(acceptance["state_matrix"])
          expected_scene_matrix = set(acceptance["fixture_scenes"]["android"])

          manifest_path = root / android_cfg["manifest_file"]
          if not manifest_path.exists():
              raise SystemExit(f"Android runtime manifest missing from runtime producer: {manifest_path.name}")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          expected_required_evidence = [
              "build",
              "navigation_flow",
              "fixture_smoke",
              "theme_parity",
              "identity_visuals",
              "security_tone_matrix",
              "empty_state_art",
              "detail_tab_hidden_parity",
              "scene_matrix",
              "viewport_matrix",
              "tuple_matrix",
          ]
          if manifest.get("platform") != "android":
              raise SystemExit("android runtime manifest platform mismatch")
          if manifest.get("required_evidence_satisfied") != expected_required_evidence:
              raise SystemExit("android runtime manifest required_evidence_satisfied mismatch")
          if manifest.get("tuple_markers_emitted_by_runtime") is not True:
              raise SystemExit("android runtime manifest must declare tuple_markers_emitted_by_runtime=true")
          if manifest.get("runtime_marker_source") != android_cfg["runtime_marker_source"]:
              raise SystemExit("android runtime manifest runtime_marker_source mismatch")

          scene_evidence = manifest.get("scene_evidence")
          theme_evidence = manifest.get("theme_evidence")
          state_evidence = manifest.get("state_evidence")
          tuple_evidence = manifest.get("tuple_evidence")
          if not isinstance(scene_evidence, dict):
              raise SystemExit("android runtime manifest scene_evidence missing")
          if not isinstance(theme_evidence, dict):
              raise SystemExit("android runtime manifest theme_evidence missing")
          if not isinstance(state_evidence, dict):
              raise SystemExit("android runtime manifest state_evidence missing")
          if not isinstance(tuple_evidence, dict):
              raise SystemExit("android runtime manifest tuple_evidence missing")

          def validate_marker(marker_path: Path, key: str, value: str, expected_evidence: list[str]) -> None:
              if not marker_path.exists():
                  raise SystemExit(f"Android runtime marker missing: {marker_path.name}")
              payload = json.loads(marker_path.read_text(encoding="utf-8"))
              if payload.get("platform") != "android":
                  raise SystemExit(f"{marker_path.name} platform mismatch")
              if payload.get(key) != value:
                  raise SystemExit(f"{marker_path.name} {key} mismatch")
              evidence_files = payload.get("evidence_files")
              if not isinstance(evidence_files, list) or not evidence_files:
                  raise SystemExit(f"{marker_path.name} missing non-empty evidence_files")
              if set(evidence_files) != set(expected_evidence):
                  raise SystemExit(f"{marker_path.name} evidence_files mismatch")
              for rel in evidence_files:
                  if not (root / rel).exists():
                      raise SystemExit(f"{marker_path.name} evidence file missing: {rel}")

          def validate_tuple_marker(marker_path: Path, scene: str, theme: str, state: str, tuple_key: str, expected_evidence: list[str]) -> None:
              if not marker_path.exists():
                  raise SystemExit(f"Android runtime tuple marker missing: {marker_path.name}")
              payload = json.loads(marker_path.read_text(encoding="utf-8"))
              if payload.get("platform") != "android":
                  raise SystemExit(f"{marker_path.name} platform mismatch")
              if payload.get("scene") != scene:
                  raise SystemExit(f"{marker_path.name} scene mismatch")
              if payload.get("theme") != theme:
                  raise SystemExit(f"{marker_path.name} theme mismatch")
              if payload.get("state") != state:
                  raise SystemExit(f"{marker_path.name} state mismatch")
              if payload.get("tuple_key") != tuple_key:
                  raise SystemExit(f"{marker_path.name} tuple_key mismatch")
              evidence_files = payload.get("evidence_files")
              if not isinstance(evidence_files, list) or not evidence_files:
                  raise SystemExit(f"{marker_path.name} missing non-empty evidence_files")
              if set(evidence_files) != set(expected_evidence):
                  raise SystemExit(f"{marker_path.name} evidence_files mismatch")
              for rel in evidence_files:
                  if not (root / rel).exists():
                      raise SystemExit(f"{marker_path.name} evidence file missing: {rel}")

          manifest_tuple_keys = set(manifest.get("tuple_matrix_validated", []))
          expected_tuple_keys: set[str] = set()
          for entry in tuple_entries:
              scene = entry["scene"]
              theme = entry["theme"]
              state = entry["state"]
              evidence_files = entry["evidence_files"]
              tuple_key = f"{scene}|{theme}|{state}"
              expected_tuple_keys.add(tuple_key)
              if tuple_evidence.get(tuple_key) != evidence_files:
                  raise SystemExit(f"android runtime tuple_evidence mismatch: {tuple_key}")
              validate_tuple_marker(
                  root / f"{android_cfg['tuple_marker_prefix']}{scene}__{theme}__{state}.json",
                  scene,
                  theme,
                  state,
                  tuple_key,
                  evidence_files,
              )
          if manifest_tuple_keys != expected_tuple_keys:
              raise SystemExit(
                  "android runtime tuple_matrix_validated mismatch:\n"
                  f"expected={sorted(expected_tuple_keys)}\nactual={sorted(manifest_tuple_keys)}"
              )

          for scene in sorted(expected_scene_matrix):
              evidence_files = scene_evidence.get(scene)
              if not isinstance(evidence_files, list) or not evidence_files:
                  raise SystemExit(f"android runtime scene_evidence missing: {scene}")
              validate_marker(root / f"{android_cfg['scene_marker_prefix']}{scene}.json", "scene", scene, evidence_files)
          if set(manifest.get("scenes_validated", [])) != expected_scene_matrix:
              raise SystemExit("android runtime scenes_validated mismatch")

          for theme in sorted(expected_theme_matrix):
              evidence_files = theme_evidence.get(theme)
              if not isinstance(evidence_files, list) or not evidence_files:
                  raise SystemExit(f"android runtime theme_evidence missing: {theme}")
              validate_marker(root / f"{android_cfg['theme_marker_prefix']}{theme}.json", "theme", theme, evidence_files)
          if set(manifest.get("theme_matrix_validated", [])) != expected_theme_matrix:
              raise SystemExit("android runtime theme_matrix_validated mismatch")

          for state in sorted(expected_state_matrix):
              evidence_files = state_evidence.get(state)
              if not isinstance(evidence_files, list) or not evidence_files:
                  raise SystemExit(f"android runtime state_evidence missing: {state}")
              validate_marker(root / f"{android_cfg['state_marker_prefix']}{state}.json", "state", state, evidence_files)
          if set(manifest.get("state_matrix_validated", [])) != expected_state_matrix:
              raise SystemExit("android runtime state_matrix_validated mismatch")

          manifest["emulator_validated"] = os.environ.get("ANDROID_EMULATOR_VALIDATED") == "true"
          manifest["arm64_validated"] = os.environ.get("ANDROID_ARM64_VALIDATED") == "true"
          manifest["arm64_waived"] = os.environ.get("ANDROID_ARM64_WAIVED") == "true"
          manifest["arm64_waiver_reason"] = os.environ.get("ANDROID_ARM64_WAIVER_REASON", "")
          manifest["arm64_gate_passed"] = os.environ.get("ANDROID_ARM64_GATE_PASSED") == "true"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Android UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi_e2ee_android_ui_smoke
          path: build/android_ui_artifacts/*
          if-no-files-found: error

  final-acceptance:
    if: always()
    needs:
      - verify-ui-contract
      - build-package
      - build-linux
      - build-linux-debian
      - build-macos
      - build-ios-rootauth
      - build-android
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download acceptance artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mi_e2ee_*
          path: build/final_acceptance_artifacts

      - name: Verify runtime evidence artifacts
        env:
          ANDROID_ARM64_VALIDATED: ${{ needs.build-android.outputs.arm64_validated }}
          ANDROID_ARM64_WAIVED: ${{ needs.build-android.outputs.arm64_waived }}
          ANDROID_ARM64_WAIVER_REASON: ${{ needs.build-android.outputs.arm64_waiver_reason }}
          ANDROID_ARM64_GATE_PASSED: ${{ needs.build-android.outputs.arm64_gate_passed }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          acceptance = json.loads(Path("ui_contract/acceptance.json").read_text(encoding="utf-8"))
          runtime = acceptance["runtime_artifact_contract"]
          manifests_cfg = runtime["evidence_manifests"]
          artifacts_root = Path("build/final_acceptance_artifacts")
          errors: list[str] = []

          def expect(condition: bool, message: str) -> None:
              if not condition:
                  errors.append(message)

          def artifact_dir(name: str) -> Path:
              return artifacts_root / name

          def find_single(path: Path, name: str) -> Path | None:
              if not path.exists():
                  return None
              matches = [candidate for candidate in path.rglob(name) if candidate.is_file()]
              if not matches:
                  return None
              return matches[0]

          def load_manifest(config_key: str) -> dict:
              config = manifests_cfg[config_key]
              root = artifact_dir(config["artifact_name"])
              expect(root.exists(), f"artifact directory missing: {root}")
              manifest_path = find_single(root, config["manifest_file"])
              expect(manifest_path is not None, f"manifest missing: {config['artifact_name']}/{config['manifest_file']}")
              if manifest_path is None:
                  return {}
              return json.loads(manifest_path.read_text(encoding="utf-8"))

          static_manifest = load_manifest("static_contract")
          windows_manifest = load_manifest("windows_runtime")
          ios_manifest = load_manifest("ios_runtime")
          android_manifest = load_manifest("android_runtime")

          covered_evidence: set[str] = set()
          for manifest in (static_manifest, windows_manifest, ios_manifest, android_manifest):
              covered_evidence.update(manifest.get("required_evidence_satisfied", []))
          missing_evidence = [item for item in acceptance["required_evidence"] if item not in covered_evidence]
          expect(not missing_evidence, "required_evidence runtime coverage missing: " + ", ".join(missing_evidence))

          expectations = runtime["artifact_expectations"]
          for package_artifact in expectations["windows_packages"] + expectations["android_packages"]:
              package_dir = artifact_dir(package_artifact)
              expect(package_dir.exists(), f"artifact missing: {package_artifact}")
              if package_dir.exists():
                  expect(any(candidate.is_file() for candidate in package_dir.rglob("*")), f"artifact empty: {package_artifact}")

          ios_dir = artifact_dir(manifests_cfg["ios_runtime"]["artifact_name"])
          expect(
              find_single(ios_dir, expectations["ios_bundle_glob"]) is not None,
              f"iOS bundle evidence missing: {expectations['ios_bundle_glob']}",
          )

          windows_dir = artifact_dir(manifests_cfg["windows_runtime"]["artifact_name"])
          android_dir = artifact_dir(manifests_cfg["android_runtime"]["artifact_name"])
          platform_dirs = {
              "windows": windows_dir,
              "ios": ios_dir,
              "android": android_dir,
          }
          runtime_manifests = {
              "windows": windows_manifest,
              "ios": ios_manifest,
              "android": android_manifest,
          }

          required_windows_runtime = [
              "build/login-zh-CN-light-100.png",
              "build/post-login-zh-CN-light-100.png",
              "build/post-login-light-zh-CN-light-100.png",
              "build/security-center-zh-CN-light-100.png",
              "build/chat-detail-zh-CN-light-100.png",
              "build/calls-home-zh-CN-light-100.png",
              "build/settings-home-zh-CN-light-100.png",
              "build/post-login-zh-CN-dark-100.png",
              "build/post-login-en-US-light-100.png",
              "dist/login-zh-CN-light-100.png",
              "dist/post-login-zh-CN-light-100.png",
              "dist/post-login-light-zh-CN-light-100.png",
              "dist/security-center-zh-CN-light-100.png",
              "dist/chat-detail-zh-CN-light-100.png",
              "dist/calls-home-zh-CN-light-100.png",
              "dist/settings-home-zh-CN-light-100.png",
              "dist/post-login-zh-CN-dark-100.png",
              "dist/post-login-en-US-light-100.png",
          ]
          for relative_path in required_windows_runtime:
              expect((windows_dir / relative_path).exists(), f"Windows runtime artifact missing: {relative_path}")

          for platform, inventory in runtime["screenshot_inventory"].items():
              if platform == "windows":
                  continue
              directory = platform_dirs[platform]
              for scene, filename in inventory.items():
                  expect(find_single(directory, filename) is not None, f"{platform} screenshot missing for {scene}: {filename}")

          def validate_marker(
              *,
              directory: Path,
              marker: Path,
              platform: str,
              key: str,
              value: str,
              expected_evidence: list[str],
          ) -> None:
              expect(marker.exists(), f"{platform} {key} matrix marker missing: {marker.name}")
              if not marker.exists():
                  return
              try:
                  payload = json.loads(marker.read_text(encoding="utf-8"))
              except Exception as exc:
                  expect(False, f"invalid JSON marker {marker.name}: {exc}")
                  return
              expect(payload.get("platform") == platform, f"{marker.name} platform mismatch")
              expect(payload.get(key) == value, f"{marker.name} {key} mismatch")
              evidence_files = payload.get("evidence_files")
              expect(isinstance(evidence_files, list) and len(evidence_files) > 0, f"{marker.name} missing non-empty evidence_files")
              if not isinstance(evidence_files, list) or not evidence_files:
                  return
              expect(
                  set(evidence_files) == set(expected_evidence),
                  f"{marker.name} evidence_files mismatch with runtime manifest",
              )
              for rel in evidence_files:
                  expect((directory / rel).exists(), f"{marker.name} evidence file missing: {rel}")

          def validate_tuple_marker(
              *,
              directory: Path,
              marker: Path,
              platform: str,
              scene: str,
              theme: str,
              state: str,
              tuple_key: str,
              expected_evidence: list[str],
          ) -> None:
              expect(marker.exists(), f"{platform} tuple marker missing: {marker.name}")
              if not marker.exists():
                  return
              try:
                  payload = json.loads(marker.read_text(encoding="utf-8"))
              except Exception as exc:
                  expect(False, f"invalid JSON tuple marker {marker.name}: {exc}")
                  return
              expect(payload.get("platform") == platform, f"{marker.name} platform mismatch")
              expect(payload.get("scene") == scene, f"{marker.name} scene mismatch")
              expect(payload.get("theme") == theme, f"{marker.name} theme mismatch")
              expect(payload.get("state") == state, f"{marker.name} state mismatch")
              expect(payload.get("tuple_key") == tuple_key, f"{marker.name} tuple_key mismatch")
              evidence_files = payload.get("evidence_files")
              expect(isinstance(evidence_files, list) and len(evidence_files) > 0, f"{marker.name} missing non-empty evidence_files")
              if not isinstance(evidence_files, list) or not evidence_files:
                  return
              expect(
                  set(evidence_files) == set(expected_evidence),
                  f"{marker.name} evidence_files mismatch with runtime manifest",
              )
              for rel in evidence_files:
                  expect((directory / rel).exists(), f"{marker.name} evidence file missing: {rel}")

          tuple_inventory = runtime.get("tuple_inventory", {})

          def derive_tuple_maps(entries: list[dict]) -> tuple[dict[str, list[str]], dict[str, list[str]], dict[str, list[str]], dict[str, list[str]]]:
              scene_map: dict[str, list[str]] = {}
              theme_map: dict[str, list[str]] = {}
              state_map: dict[str, list[str]] = {}
              tuple_map: dict[str, list[str]] = {}

              def extend_unique(target: dict[str, list[str]], key: str, evidence_files: list[str]) -> None:
                  bucket = target.setdefault(key, [])
                  for rel in evidence_files:
                      if rel not in bucket:
                          bucket.append(rel)

              for tuple_item in entries:
                  scene = tuple_item["scene"]
                  theme = tuple_item["theme"]
                  state = tuple_item["state"]
                  evidence_files = list(tuple_item["evidence_files"])
                  tuple_key = f"{scene}|{theme}|{state}"
                  tuple_map[tuple_key] = evidence_files
                  extend_unique(scene_map, scene, evidence_files)
                  extend_unique(theme_map, theme, evidence_files)
                  extend_unique(state_map, state, evidence_files)
              return scene_map, theme_map, state_map, tuple_map

          for platform, config_key in (
              ("windows", "windows_runtime"),
              ("ios", "ios_runtime"),
              ("android", "android_runtime"),
          ):
              directory = platform_dirs[platform]
              config = manifests_cfg[config_key]
              manifest = runtime_manifests[platform]
              if platform == "android":
                  expect(
                      manifest.get("tuple_markers_emitted_by_runtime") is True,
                      "android runtime manifest must declare tuple_markers_emitted_by_runtime=true",
                  )
                  expect(
                      manifest.get("runtime_marker_source") == config.get("runtime_marker_source"),
                      "android runtime manifest runtime_marker_source mismatch",
                  )
              platform_tuples = tuple_inventory.get(platform, [])
              expect(isinstance(platform_tuples, list) and len(platform_tuples) > 0, f"{platform} tuple_inventory missing or empty")
              if not isinstance(platform_tuples, list):
                  platform_tuples = []
              expected_scene_evidence, expected_theme_evidence, expected_state_evidence, expected_tuple_evidence = derive_tuple_maps(platform_tuples)

              expected_scenes = set(acceptance["fixture_scenes"][platform])
              expected_themes = set(acceptance["theme_matrix"])
              expected_states = set(acceptance["state_matrix"])
              manifest_scenes = set(manifest.get("scenes_validated", []))
              manifest_themes = set(manifest.get("theme_matrix_validated", []))
              manifest_states = set(manifest.get("state_matrix_validated", []))
              manifest_tuple_keys = set(manifest.get("tuple_matrix_validated", []))

              expect(manifest_scenes == expected_scenes, f"{platform} runtime manifest scenes mismatch: expected={sorted(expected_scenes)} actual={sorted(manifest_scenes)}")
              expect(manifest_themes == expected_themes, f"{platform} runtime manifest themes mismatch: expected={sorted(expected_themes)} actual={sorted(manifest_themes)}")
              expect(manifest_states == expected_states, f"{platform} runtime manifest states mismatch: expected={sorted(expected_states)} actual={sorted(manifest_states)}")
              expect(
                  manifest_tuple_keys == set(expected_tuple_evidence.keys()),
                  f"{platform} runtime manifest tuple keys mismatch: expected={sorted(expected_tuple_evidence.keys())} actual={sorted(manifest_tuple_keys)}",
              )

              scene_evidence = manifest.get("scene_evidence")
              theme_evidence = manifest.get("theme_evidence")
              state_evidence = manifest.get("state_evidence")
              tuple_evidence = manifest.get("tuple_evidence")
              expect(isinstance(scene_evidence, dict), f"{platform} runtime manifest missing scene_evidence")
              expect(isinstance(theme_evidence, dict), f"{platform} runtime manifest missing theme_evidence")
              expect(isinstance(state_evidence, dict), f"{platform} runtime manifest missing state_evidence")
              expect(isinstance(tuple_evidence, dict), f"{platform} runtime manifest missing tuple_evidence")
              if not isinstance(scene_evidence, dict):
                  scene_evidence = {}
              if not isinstance(theme_evidence, dict):
                  theme_evidence = {}
              if not isinstance(state_evidence, dict):
                  state_evidence = {}
              if not isinstance(tuple_evidence, dict):
                  tuple_evidence = {}

              expect(set(scene_evidence.keys()) == expected_scenes, f"{platform} scene_evidence keys mismatch")
              expect(set(theme_evidence.keys()) == expected_themes, f"{platform} theme_evidence keys mismatch")
              expect(set(state_evidence.keys()) == expected_states, f"{platform} state_evidence keys mismatch")
              expect(set(tuple_evidence.keys()) == set(expected_tuple_evidence.keys()), f"{platform} tuple_evidence keys mismatch")

              for scene in acceptance["fixture_scenes"][platform]:
                  expected_evidence = expected_scene_evidence.get(scene, [])
                  actual_evidence = scene_evidence.get(scene, [])
                  expect(expected_evidence, f"{platform} tuple_inventory missing scene coverage: {scene}")
                  expect(isinstance(actual_evidence, list) and len(actual_evidence) > 0, f"{platform} scene_evidence missing: {scene}")
                  if isinstance(actual_evidence, list):
                      expect(set(actual_evidence) == set(expected_evidence), f"{platform} scene_evidence mismatch: {scene}")
                      for rel in actual_evidence:
                          expect((directory / rel).exists(), f"{platform} scene evidence file missing for {scene}: {rel}")
                  validate_marker(
                      directory=directory,
                      marker=directory / f"{config['scene_marker_prefix']}{scene}.json",
                      platform=platform,
                      key="scene",
                      value=scene,
                      expected_evidence=expected_evidence,
                  )

              for theme in acceptance["theme_matrix"]:
                  expected_evidence = expected_theme_evidence.get(theme, [])
                  actual_evidence = theme_evidence.get(theme, [])
                  expect(expected_evidence, f"{platform} tuple_inventory missing theme coverage: {theme}")
                  expect(isinstance(actual_evidence, list) and len(actual_evidence) > 0, f"{platform} theme_evidence missing: {theme}")
                  if isinstance(actual_evidence, list):
                      expect(set(actual_evidence) == set(expected_evidence), f"{platform} theme_evidence mismatch: {theme}")
                      for rel in actual_evidence:
                          expect((directory / rel).exists(), f"{platform} theme evidence file missing for {theme}: {rel}")
                  validate_marker(
                      directory=directory,
                      marker=directory / f"{config['theme_marker_prefix']}{theme}.json",
                      platform=platform,
                      key="theme",
                      value=theme,
                      expected_evidence=expected_evidence,
                  )

              for state in acceptance["state_matrix"]:
                  expected_evidence = expected_state_evidence.get(state, [])
                  actual_evidence = state_evidence.get(state, [])
                  expect(expected_evidence, f"{platform} tuple_inventory missing state coverage: {state}")
                  expect(isinstance(actual_evidence, list) and len(actual_evidence) > 0, f"{platform} state_evidence missing: {state}")
                  if isinstance(actual_evidence, list):
                      expect(set(actual_evidence) == set(expected_evidence), f"{platform} state_evidence mismatch: {state}")
                      for rel in actual_evidence:
                          expect((directory / rel).exists(), f"{platform} state evidence file missing for {state}: {rel}")
                  validate_marker(
                      directory=directory,
                      marker=directory / f"{config['state_marker_prefix']}{state}.json",
                      platform=platform,
                      key="state",
                      value=state,
                      expected_evidence=expected_evidence,
                  )

              for tuple_item in platform_tuples:
                  if not isinstance(tuple_item, dict):
                      expect(False, f"{platform} tuple_inventory entry is not an object")
                      continue
                  scene = tuple_item.get("scene")
                  theme = tuple_item.get("theme")
                  state = tuple_item.get("state")
                  expected_evidence = tuple_item.get("evidence_files")
                  tuple_key = f"{scene}|{theme}|{state}"
                  expect(scene in acceptance["fixture_scenes"][platform], f"{platform} tuple scene not in fixture_scenes: {scene}")
                  expect(theme in acceptance["theme_matrix"], f"{platform} tuple theme not in theme_matrix: {theme}")
                  expect(state in acceptance["state_matrix"], f"{platform} tuple state not in state_matrix: {state}")
                  expect(isinstance(expected_evidence, list) and len(expected_evidence) > 0, f"{platform} tuple evidence_files missing: {tuple_key}")
                  actual_evidence = tuple_evidence.get(tuple_key, [])
                  expect(isinstance(actual_evidence, list) and len(actual_evidence) > 0, f"{platform} tuple_evidence missing: {tuple_key}")
                  if isinstance(expected_evidence, list) and isinstance(actual_evidence, list):
                      expect(set(actual_evidence) == set(expected_evidence), f"{platform} tuple_evidence mismatch: {tuple_key}")
                  for rel in actual_evidence if isinstance(actual_evidence, list) else []:
                      expect((directory / rel).exists(), f"{platform} tuple evidence file missing for {tuple_key}: {rel}")
                  marker_name = f"{config['tuple_marker_prefix']}{scene}__{theme}__{state}.json"
                  validate_tuple_marker(
                      directory=directory,
                      marker=directory / marker_name,
                      platform=platform,
                      scene=scene,
                      theme=theme,
                      state=state,
                      tuple_key=tuple_key,
                      expected_evidence=expected_evidence if isinstance(expected_evidence, list) else [],
                  )

          arm64_manifest_path = find_single(android_dir, expectations["android_arm64_validation_manifest"])
          expect(
              arm64_manifest_path is not None,
              f"Android arm64 validation manifest missing: {expectations['android_arm64_validation_manifest']}",
          )
          if arm64_manifest_path is not None:
              arm64_manifest = json.loads(arm64_manifest_path.read_text(encoding="utf-8"))
              policy = expectations.get("android_arm64_requirement", {})
              mode = policy.get("mode")
              allowed_waiver_reasons = policy.get("allowed_waiver_reasons", [])
              validated_evidence_source = policy.get("validated_evidence_source")
              waived_evidence_source = policy.get("waived_evidence_source")
              required_manifest_fields = policy.get("required_manifest_fields", [])
              required_privacy_fields = policy.get("required_privacy_fields", [])
              validated_requires_privacy_true = policy.get("validated_requires_privacy_true", [])
              validated = arm64_manifest.get("validated")
              waived = arm64_manifest.get("waived")
              waiver_reason = arm64_manifest.get("waiver_reason")
              evidence_source = arm64_manifest.get("evidence_source")
              gate_passed = arm64_manifest.get("gate_passed")
              requested_device_matrix = arm64_manifest.get("requested_device_matrix")
              privacy_evidence = arm64_manifest.get("privacy_evidence")
              expect(mode == "required_or_waived", f"Unsupported Android arm64 requirement mode: {mode}")
              expect(arm64_manifest.get("requirement_mode") == mode, "Android arm64 manifest requirement_mode mismatch")
              expect(isinstance(validated, bool), "Android arm64 manifest validated must be bool")
              expect(isinstance(waived, bool), "Android arm64 manifest waived must be bool")
              expect(isinstance(gate_passed, bool), "Android arm64 manifest gate_passed must be bool")
              expect(isinstance(requested_device_matrix, list), "Android arm64 manifest requested_device_matrix must be a list")
              expect(isinstance(privacy_evidence, dict), "Android arm64 manifest privacy_evidence must be an object")
              for field in required_manifest_fields if isinstance(required_manifest_fields, list) else []:
                  expect(field in arm64_manifest, f"Android arm64 manifest missing required field: {field}")
              if not isinstance(privacy_evidence, dict):
                  privacy_evidence = {}
              for field in required_privacy_fields if isinstance(required_privacy_fields, list) else []:
                  expect(field in privacy_evidence, f"Android arm64 privacy_evidence missing required field: {field}")
                  if field in privacy_evidence:
                      expect(isinstance(privacy_evidence[field], bool), f"Android arm64 privacy_evidence field must be bool: {field}")
              if validated is True:
                  expect(waived is False, "Android arm64 manifest cannot be both validated and waived")
                  expect(waiver_reason in ("", None), "Android arm64 waiver_reason must be empty when validated=true")
                  expect(evidence_source == validated_evidence_source, f"Android arm64 validated evidence_source mismatch: {evidence_source}")
                  expect(
                      isinstance(requested_device_matrix, list) and len(requested_device_matrix) > 0,
                      "Android arm64 validated manifest must include a non-empty requested_device_matrix",
                  )
                  for field in validated_requires_privacy_true if isinstance(validated_requires_privacy_true, list) else []:
                      expect(privacy_evidence.get(field) is True, f"Android arm64 privacy_evidence.{field} must be true when validated=true")
                  expect(gate_passed is True, "Android arm64 gate_passed must be true when validated=true")
              else:
                  expect(waived is True, "Android arm64 requires waived=true when validated=false")
                  expect(
                      waiver_reason in allowed_waiver_reasons,
                      f"Android arm64 waiver_reason is not allowed: {waiver_reason}",
                  )
                  expect(evidence_source == waived_evidence_source, f"Android arm64 waived evidence_source mismatch: {evidence_source}")
                  expect(gate_passed is True, "Android arm64 gate_passed must be true for allowed waiver")
                  if waiver_reason == "android_tests_skipped":
                      expect(privacy_evidence.get("skip_android_tests") is True, "Android arm64 waiver android_tests_skipped must set privacy_evidence.skip_android_tests=true")
                  if waiver_reason == "missing_gcp_credentials":
                      expect(
                          privacy_evidence.get("has_gcp_service_account_json") is False or privacy_evidence.get("has_gcp_project_id") is False,
                          "Android arm64 waiver missing_gcp_credentials must show missing GCP privacy evidence",
                      )
              env_validated = os.environ.get("ANDROID_ARM64_VALIDATED")
              env_waived = os.environ.get("ANDROID_ARM64_WAIVED")
              env_waiver_reason = os.environ.get("ANDROID_ARM64_WAIVER_REASON", "")
              env_gate_passed = os.environ.get("ANDROID_ARM64_GATE_PASSED")
              expect(
                  env_validated == ("true" if validated else "false"),
                  f"Android arm64 validated output mismatch: env={env_validated}, manifest={validated}",
              )
              expect(
                  env_waived == ("true" if waived else "false"),
                  f"Android arm64 waived output mismatch: env={env_waived}, manifest={waived}",
              )
              expect(
                  env_waiver_reason == (waiver_reason or ""),
                  f"Android arm64 waiver_reason output mismatch: env={env_waiver_reason}, manifest={waiver_reason}",
              )
              expect(
                  env_gate_passed == ("true" if gate_passed else "false"),
                  f"Android arm64 gate_passed output mismatch: env={env_gate_passed}, manifest={gate_passed}",
              )
              expect(
                  android_manifest.get("arm64_validated") == validated,
                  "Android runtime manifest arm64_validated mismatch with arm64 manifest",
              )
              expect(
                  android_manifest.get("arm64_waived") == waived,
                  "Android runtime manifest arm64_waived mismatch with arm64 manifest",
              )
              expect(
                  android_manifest.get("arm64_waiver_reason", "") == (waiver_reason or ""),
                  "Android runtime manifest arm64_waiver_reason mismatch with arm64 manifest",
              )
              expect(
                  android_manifest.get("arm64_gate_passed") == gate_passed,
                  "Android runtime manifest arm64_gate_passed mismatch with arm64 manifest",
              )

          if errors:
              for error in errors:
                  print(f"ERROR: {error}")
              raise SystemExit(1)
          print("Runtime evidence validation passed.")
          PY

      - name: Verify final acceptance gates
        env:
          VERIFY_UI_CONTRACT_RESULT: ${{ needs.verify-ui-contract.result }}
          BUILD_PACKAGE_RESULT: ${{ needs.build-package.result }}
          BUILD_LINUX_RESULT: ${{ needs.build-linux.result }}
          BUILD_LINUX_DEBIAN_RESULT: ${{ needs.build-linux-debian.result }}
          BUILD_MACOS_RESULT: ${{ needs.build-macos.result }}
          BUILD_IOS_RESULT: ${{ needs.build-ios-rootauth.result }}
          BUILD_ANDROID_RESULT: ${{ needs.build-android.result }}
          IOS_APP_BUNDLE_VERIFIED: ${{ needs.build-ios-rootauth.outputs.app_bundle_verified }}
          IOS_SMOKE_VERIFIED: ${{ needs.build-ios-rootauth.outputs.smoke_verified }}
          ANDROID_EMULATOR_VALIDATED: ${{ needs.build-android.outputs.emulator_validated }}
          ANDROID_ARM64_VALIDATED: ${{ needs.build-android.outputs.arm64_validated }}
          ANDROID_ARM64_WAIVED: ${{ needs.build-android.outputs.arm64_waived }}
          ANDROID_ARM64_WAIVER_REASON: ${{ needs.build-android.outputs.arm64_waiver_reason }}
          ANDROID_ARM64_GATE_PASSED: ${{ needs.build-android.outputs.arm64_gate_passed }}
        run: |
          set -euo pipefail
          fail=0
          check_job() {
            local name="$1"
            local value="$2"
            if [ "$value" != "success" ]; then
              echo "$name did not succeed: $value" >&2
              fail=1
            fi
          }
          check_flag() {
            local name="$1"
            local value="$2"
            if [ "$value" != "true" ]; then
              echo "$name missing: $value" >&2
              fail=1
            fi
          }
          check_job "verify-ui-contract" "$VERIFY_UI_CONTRACT_RESULT"
          check_job "build-package" "$BUILD_PACKAGE_RESULT"
          check_job "build-linux" "$BUILD_LINUX_RESULT"
          check_job "build-linux-debian" "$BUILD_LINUX_DEBIAN_RESULT"
          check_job "build-macos" "$BUILD_MACOS_RESULT"
          check_job "build-ios-rootauth" "$BUILD_IOS_RESULT"
          check_job "build-android" "$BUILD_ANDROID_RESULT"
          check_flag "ios app bundle evidence" "$IOS_APP_BUNDLE_VERIFIED"
          check_flag "ios smoke evidence" "$IOS_SMOKE_VERIFIED"
          check_flag "android emulator evidence" "$ANDROID_EMULATOR_VALIDATED"
          check_flag "android arm64 contract gate" "$ANDROID_ARM64_GATE_PASSED"
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Publish final acceptance summary
        env:
          IOS_APP_BUNDLE_VERIFIED: ${{ needs.build-ios-rootauth.outputs.app_bundle_verified }}
          IOS_SMOKE_VERIFIED: ${{ needs.build-ios-rootauth.outputs.smoke_verified }}
          ANDROID_EMULATOR_VALIDATED: ${{ needs.build-android.outputs.emulator_validated }}
          ANDROID_ARM64_VALIDATED: ${{ needs.build-android.outputs.arm64_validated }}
          ANDROID_ARM64_WAIVED: ${{ needs.build-android.outputs.arm64_waived }}
          ANDROID_ARM64_WAIVER_REASON: ${{ needs.build-android.outputs.arm64_waiver_reason }}
          ANDROID_ARM64_GATE_PASSED: ${{ needs.build-android.outputs.arm64_gate_passed }}
        run: |
          {
            echo "## Final Acceptance"
            echo
            echo "- Shared UI contract verification: success"
            echo "- Windows/Linux/macOS packaging jobs: success"
            echo "- iOS app bundle evidence: ${IOS_APP_BUNDLE_VERIFIED}"
            echo "- iOS smoke evidence: ${IOS_SMOKE_VERIFIED}"
            echo "- Android emulator evidence: ${ANDROID_EMULATOR_VALIDATED}"
            echo "- Android arm64 evidence: ${ANDROID_ARM64_VALIDATED}"
            echo "- Android arm64 waived: ${ANDROID_ARM64_WAIVED}"
            echo "- Android arm64 waiver reason: ${ANDROID_ARM64_WAIVER_REASON}"
            echo "- Android arm64 contract gate: ${ANDROID_ARM64_GATE_PASSED}"
          } >> "$GITHUB_STEP_SUMMARY"
