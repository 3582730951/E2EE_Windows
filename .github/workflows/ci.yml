  build-ios-rootauth:
    runs-on: macos-latest
    outputs:
      app_bundle_verified: ${{ steps.ios_bundle.outputs.app_bundle_verified }}
      smoke_verified: ${{ steps.ios_smoke.outputs.smoke_verified }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate RootAuth Xcode project
        run: |
          set -euo pipefail
          cd ios_root_app
          xcodegen generate
          test -f RootAuthApp.xcodeproj/project.pbxproj

      - name: Build RootAuth for iOS Simulator
        run: |
          set -euo pipefail
          cd ios_root_app
          DERIVED_DATA="$GITHUB_WORKSPACE/build/ios_rootauth_derived"
          mkdir -p "$GITHUB_WORKSPACE/build"
          xcodebuild \
            -project RootAuthApp.xcodeproj \
            -scheme RootAuthApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$GITHUB_WORKSPACE/build/ios_rootauth_xcodebuild.log"

      - name: Validate RootAuth iOS bundle
        id: ios_bundle
        run: |
          set -euo pipefail
          app_path=$(find "$GITHUB_WORKSPACE/build/ios_rootauth_derived/Build/Products" -type d -name 'RootAuthApp.app' | head -n 1)
          if [ -z "$app_path" ] || [ ! -d "$app_path" ]; then
            echo "RootAuth simulator app bundle missing" >&2
            exit 1
          fi
          mkdir -p build/ios_rootauth_artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app_path" build/ios_rootauth_artifacts/RootAuthApp-sim.zip
          echo "app_bundle_verified=true" >> "$GITHUB_OUTPUT"

      - name: Run RootAuth iOS smoke
        id: ios_smoke
        run: |
          set -euo pipefail
          mkdir -p build
          xcrun swiftc \
            ios_root_app/RootAuthApp/RootAuthNetwork.swift \
            tools/ios_rootauth_smoke.swift \
            -o build/ios_rootauth_smoke
          build/ios_rootauth_smoke | tee build/ios_rootauth_smoke.log
          echo "smoke_verified=true" >> "$GITHUB_OUTPUT"

      - name: Capture RootAuth iOS screenshot
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/ios_rootauth_artifacts
          app_path=$(find "$GITHUB_WORKSPACE/build/ios_rootauth_derived/Build/Products" -type d -name 'RootAuthApp.app' | head -n 1)
          if [ -z "$app_path" ] || [ ! -d "$app_path" ]; then
            echo "RootAuth simulator app bundle missing; skip screenshot" >&2
            exit 0
          fi
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          udid=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          if [ -z "$udid" ]; then
            echo "No available iPhone simulator found; skip screenshot" >&2
            exit 0
          fi
          xcrun simctl erase "$udid" >/dev/null 2>&1 || true
          xcrun simctl boot "$udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$udid" -b || {
            echo "Simulator boot failed; skip screenshot" >&2
            exit 0
          }
          xcrun simctl install "$udid" "$app_path" || {
            echo "Simulator install failed; skip screenshot" >&2
            exit 0
          }
          screenshot_is_windowed() {
            local image_path="$1"
            /usr/bin/python3 - "$image_path" <<'PY'
          import struct
          import sys
          import zlib
          
          path = sys.argv[1]
          data = open(path, "rb").read()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              sys.exit(2)
          
          idx = 8
          idat = b""
          width = 0
          height = 0
          bit_depth = 0
          color_type = 0
          interlace = 0
          
          while idx + 8 <= len(data):
              chunk_len = int.from_bytes(data[idx:idx + 4], "big")
              idx += 4
              chunk_type = data[idx:idx + 4]
              idx += 4
              chunk_data = data[idx:idx + chunk_len]
              idx += chunk_len
              idx += 4  # crc
              if chunk_type == b"IHDR":
                  width, height, bit_depth, color_type, _, _, interlace = struct.unpack(">IIBBBBB", chunk_data)
              elif chunk_type == b"IDAT":
                  idat += chunk_data
              elif chunk_type == b"IEND":
                  break
          
          if not width or not height or bit_depth != 8 or color_type != 6 or interlace != 0:
              sys.exit(2)
          
          raw = zlib.decompress(idat)
          bytes_per_pixel = 4
          stride = width * bytes_per_pixel
          
          left_cols = min(48, width)
          right_start = max(0, width - 48)
          left_black = [0] * left_cols
          right_black = [0] * (width - right_start)
          
          def paeth(a: int, b: int, c: int) -> int:
              p = a + b - c
              pa = abs(p - a)
              pb = abs(p - b)
              pc = abs(p - c)
              if pa <= pb and pa <= pc:
                  return a
              if pb <= pc:
                  return b
              return c
          
          cursor = 0
          prev = bytearray(stride)
          for _ in range(height):
              f = raw[cursor]
              cursor += 1
              row = bytearray(raw[cursor:cursor + stride])
              cursor += stride
              if f == 1:
                  for x in range(stride):
                      row[x] = (row[x] + (row[x - bytes_per_pixel] if x >= bytes_per_pixel else 0)) & 0xFF
              elif f == 2:
                  for x in range(stride):
                      row[x] = (row[x] + prev[x]) & 0xFF
              elif f == 3:
                  for x in range(stride):
                      left = row[x - bytes_per_pixel] if x >= bytes_per_pixel else 0
                      row[x] = (row[x] + ((left + prev[x]) // 2)) & 0xFF
              elif f == 4:
                  for x in range(stride):
                      left = row[x - bytes_per_pixel] if x >= bytes_per_pixel else 0
                      up = prev[x]
                      up_left = prev[x - bytes_per_pixel] if x >= bytes_per_pixel else 0
                      row[x] = (row[x] + paeth(left, up, up_left)) & 0xFF
          
              for x in range(left_cols):
                  o = x * bytes_per_pixel
                  if row[o] < 10 and row[o + 1] < 10 and row[o + 2] < 10:
                      left_black[x] += 1
          
              for i, x in enumerate(range(right_start, width)):
                  o = x * bytes_per_pixel
                  if row[o] < 10 and row[o + 1] < 10 and row[o + 2] < 10:
                      right_black[i] += 1
          
              prev = row
          
          left_ratio = max((value / height for value in left_black), default=0.0)
          right_ratio = max((value / height for value in right_black), default=0.0)
          sys.exit(1 if left_ratio > 0.20 or right_ratio > 0.20 else 0)
          PY
          }
          capture_screenshot() {
            local mode="$1"
            local output="$2"
            local launch_log="build/ios_rootauth_artifacts/ios_rootauth_launch_${mode}.log"
            local settle_seconds=5
            if [ "$mode" = "detail" ]; then
              settle_seconds=6
            fi
            for attempt in 1 2 3; do
              xcrun simctl terminate "$udid" mi.e2ee.root.RootAuthApp >/dev/null 2>&1 || true
              xcrun simctl keypress "$udid" HOME >/dev/null 2>&1 || true
              xcrun simctl keypress "$udid" HOME >/dev/null 2>&1 || true
              sleep 1
              SIMCTL_CHILD_MI_E2EE_IOS_SCREENSHOT_MODE="$mode" \
                xcrun simctl launch --terminate-running-process "$udid" mi.e2ee.root.RootAuthApp >"$launch_log" 2>&1 || true
              sleep "$settle_seconds"
              if ! xcrun simctl io "$udid" screenshot "$output"; then
                continue
              fi
              if screenshot_is_windowed "$output"; then
                echo "Detected simulator card/windowed state for mode=$mode (attempt=$attempt), retrying..." >&2
                continue
              fi
              return 0
            done
            return 1
          }
          capture_screenshot "chats" "build/ios_rootauth_artifacts/rootauth-ios-home.png" || {
            echo "Simulator screenshot failed; skip artifact" >&2
            exit 0
          }
          capture_screenshot "detail" "build/ios_rootauth_artifacts/rootauth-ios-detail.png" || true
          capture_screenshot "security" "build/ios_rootauth_artifacts/rootauth-ios-security.png" || true

      - name: Archive xcodebuild log
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/ios_rootauth_artifacts
          if [ -f "$GITHUB_WORKSPACE/build/ios_rootauth_xcodebuild.log" ]; then
            cp "$GITHUB_WORKSPACE/build/ios_rootauth_xcodebuild.log" build/ios_rootauth_artifacts/
          fi
          if [ -f "$GITHUB_WORKSPACE/build/ios_rootauth_smoke.log" ]; then
            cp "$GITHUB_WORKSPACE/build/ios_rootauth_smoke.log" build/ios_rootauth_artifacts/
          fi
          if [ -d "$HOME/Library/Developer/Xcode/DerivedData" ]; then
            while IFS= read -r -d '' file; do
              cp "$file" build/ios_rootauth_artifacts/
            done < <(
              find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 4 -type f \
                \( -name "*.log" -o -name "*.xcactivitylog" \) -print0
            )
          fi

      - name: Upload RootAuth iOS build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi_e2ee_ios_rootauth_logs
          path: build/ios_rootauth_artifacts/*
          if-no-files-found: ignore

  build-android:
    runs-on: ubuntu-latest
    outputs:
      emulator_validated: ${{ steps.android_emulator_validation.outputs.validated }}
      arm64_validated: ${{ steps.android_arm64_validation.outputs.validated }}
    defaults:
