name: ci

on:
  push:
    branches:
      - master
      - e2ee_dev
  workflow_dispatch:
    inputs:
      server_host:
        description: "E2EE server host/ip for CI tests (default 127.0.0.1)"
        required: false
        default: "127.0.0.1"
      server_port:
        description: "E2EE server port for CI tests (optional, default 0=auto)"
        required: false
        default: "0"
      skip_e2e:
        description: "Skip client e2e tests (default 0)"
        required: false
        default: "0"
      skip_android_tests:
        description: "Skip Android instrumentation tests (default 0)"
        required: false
        default: "0"

env:
  MI_E2EE_CI_SERVER_HOST: ${{ github.event.inputs.server_host || '127.0.0.1' }}
  MI_E2EE_CI_SERVER_PORT: ${{ github.event.inputs.server_port || '0' }}
  MI_E2EE_CI_SKIP_E2E: ${{ github.event.inputs.skip_e2e || '0' }}
  MI_E2EE_CI_SKIP_ANDROID_TESTS: ${{ github.event.inputs.skip_android_tests || '0' }}
  MI_E2EE_PERF_MIN_FRAME_ENCODE_OPS: "10000"
  MI_E2EE_PERF_MIN_FRAME_DECODE_OPS: "10000"
  MI_E2EE_PERF_MIN_OFFLINE_PUT_MBPS: "1.0"
  MI_E2EE_PERF_MIN_OFFLINE_FETCH_MBPS: "1.0"

jobs:
  build-package:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          arch: win64_msvc2022_64
          modules: qtmultimedia qtpositioning
          cache: true
          use-official: true

      - name: Fetch MySQL client
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          if (-not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg $vcpkgRoot
          }
          & "$vcpkgRoot\\bootstrap-vcpkg.bat"
          & "$vcpkgRoot\\vcpkg.exe" install libmariadb:x64-windows
          $mysqlRoot = Join-Path $vcpkgRoot "installed\\x64-windows"
          $mysqlIncludeRoot = Join-Path $mysqlRoot "include"
          $mysqlInclude = $mysqlIncludeRoot
          if (Test-Path (Join-Path $mysqlIncludeRoot "mysql\\mysql.h")) {
            $mysqlInclude = Join-Path $mysqlIncludeRoot "mysql"
          } elseif (Test-Path (Join-Path $mysqlIncludeRoot "mysql.h")) {
            $mysqlInclude = $mysqlIncludeRoot
          }
          $libCandidates = @(
            (Join-Path $mysqlRoot "lib\\libmariadb.lib")
            (Join-Path $mysqlRoot "lib\\mariadb.lib")
            (Join-Path $mysqlRoot "lib\\libmysql.lib")
            (Join-Path $mysqlRoot "lib\\mysqlclient.lib")
          )
          $mysqlLib = $libCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mysqlLib) {
            throw "MySQL client lib not found under $mysqlRoot"
          }
          "MYSQL_INCLUDE_DIR=$mysqlInclude" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MYSQL_CLIENT_LIB=$mysqlLib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch Rime runtime
        run: |
          $rimeDir = Join-Path $env:GITHUB_WORKSPACE "build\\rime_runtime"
          New-Item -ItemType Directory -Force -Path $rimeDir | Out-Null
          $fetchArgs = @(
            "-DRIME_OUTPUT_DIR=$rimeDir",
            "-DRIME_WITH_LUA=ON",
            "-DRIME_VERSION=1.15.0",
            "-DRIME_ASSET=rime-75bc43a-Windows-msvc-x64.7z",
            "-DRIME_WEASEL_VERSION=0.17.4",
            "-DRIME_WEASEL_ASSET=weasel-0.17.4.0-installer.exe",
            "-P",
            "$env:GITHUB_WORKSPACE\\client\\ui\\ime_rime\\FetchRime.cmake"
          )
          cmake @fetchArgs
          $rimeCandidates = @(
            (Join-Path $rimeDir "rime.dll"),
            (Join-Path $rimeDir "librime.dll")
          )
          $rimeDll = $rimeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $rimeDll) {
            $fallbackArgs = @(
              "-DRIME_OUTPUT_DIR=$rimeDir",
              "-DRIME_WITH_LUA=OFF",
              "-DRIME_VERSION=1.15.0",
              "-DRIME_ASSET=rime-75bc43a-Windows-msvc-x64.7z",
              "-P",
              "$env:GITHUB_WORKSPACE\\client\\ui\\ime_rime\\FetchRime.cmake"
            )
            cmake @fallbackArgs
            $rimeDll = $rimeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $rimeDll) {
            throw "rime runtime dll not found after FetchRime.cmake"
          }
          if (-not (Test-Path (Join-Path $rimeDir "rime.dll"))) {
            Copy-Item $rimeDll (Join-Path $rimeDir "rime.dll") -Force
          }
          "RIME_RUNTIME_DIR=$rimeDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch FFmpeg runtime
        run: |
          $ffmpegRoot = Join-Path $env:GITHUB_WORKSPACE "build\\ffmpeg"
          New-Item -ItemType Directory -Force -Path $ffmpegRoot | Out-Null
          $ffmpegZip = Join-Path $ffmpegRoot "ffmpeg.zip"
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegRoot -Force
          $ffmpegExe = Get-ChildItem -Path $ffmpegRoot -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ffmpegExe) {
            throw "ffmpeg.exe not found"
          }
          "FFMPEG_RUNTIME_DIR=$($ffmpegExe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch Real-ESRGAN runtime
        run: |
          $esrganRoot = Join-Path $env:GITHUB_WORKSPACE "build\\realesrgan"
          New-Item -ItemType Directory -Force -Path $esrganRoot | Out-Null
          $esrganZip = Join-Path $esrganRoot "realesrgan.zip"
          $esrganUrl = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip"
          Invoke-WebRequest -Uri $esrganUrl -OutFile $esrganZip
          Expand-Archive -Path $esrganZip -DestinationPath $esrganRoot -Force
          $esrganExe = Get-ChildItem -Path $esrganRoot -Recurse -Filter "realesrgan-ncnn-vulkan.exe" | Select-Object -First 1
          if (-not $esrganExe) {
            $esrganExe = Get-ChildItem -Path $esrganRoot -Recurse -Filter "realesrgan-ncnn.exe" | Select-Object -First 1
          }
          if (-not $esrganExe) {
            throw "realesrgan executable not found"
          }
          $modelParam = Get-ChildItem -Path $esrganRoot -Recurse -Filter "realesrgan-x4plus.param" | Select-Object -First 1
          $modelBin = Get-ChildItem -Path $esrganRoot -Recurse -Filter "realesrgan-x4plus.bin" | Select-Object -First 1
          if (-not $modelParam -or -not $modelBin) {
            throw "realesrgan model not found"
          }
          $modelDir = $modelParam.Directory.FullName
          $optionalModels = @("realesrgan-x2plus", "realesrgan-x4plus-anime")
          $modelBaseUrl = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0"
          foreach ($model in $optionalModels) {
            $paramPath = Join-Path $modelDir "$model.param"
            $binPath = Join-Path $modelDir "$model.bin"
            if (-not (Test-Path $paramPath)) {
              try {
                Invoke-WebRequest -Uri "$modelBaseUrl/$model.param" -OutFile $paramPath -ErrorAction Stop
              } catch {
                Write-Warning "Failed to download $model.param"
              }
            }
            if (-not (Test-Path $binPath)) {
              try {
                Invoke-WebRequest -Uri "$modelBaseUrl/$model.bin" -OutFile $binPath -ErrorAction Stop
              } catch {
                Write-Warning "Failed to download $model.bin"
              }
            }
          }
          "REALESRGAN_RUNTIME_DIR=$($esrganExe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "REALESRGAN_MODEL_DIR=$modelDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Python deps
        run: python -m pip install --upgrade pip wordfreq

      - name: Prepare Rime dictionaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $overlayRoot = Join-Path $env:GITHUB_WORKSPACE "build\\rime_overlay"
          python .\\tools\\rime_dict_prepare.py --out $overlayRoot

      - name: Configure client
        run: >
          cmake -S client -B build/client
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DMI_E2EE_BUILD_UI=ON
          -DMI_E2EE_BUILD_DEMO_CLIENT=OFF
          -DMI_E2EE_BUILD_LEGACY_UI=OFF
          -DMI_E2EE_BUILD_FUZZERS=OFF
          -DMI_E2EE_ENABLE_MYSQL=OFF
          -DMI_UI_RIME_DOWNLOAD=OFF
          -DMI_E2EE_PGO_INSTRUMENT=OFF
          -DMI_E2EE_ENABLE_LTO=OFF

      - name: Build rime precompile tool
        run: cmake --build build/client --config Release --target mi_rime_precompile

      - name: Precompile Rime user data
        run: |
          $precompileExe = Get-ChildItem -Path $env:GITHUB_WORKSPACE\\build\\client -Recurse -Filter "mi_rime_precompile.exe" | Select-Object -First 1
          if (-not $precompileExe) {
            throw "mi_rime_precompile.exe not found"
          }
          $prebuiltRoot = Join-Path $env:GITHUB_WORKSPACE "build\\rime_prebuilt"
          New-Item -ItemType Directory -Force -Path $prebuiltRoot | Out-Null
          $runtimeDir = $env:RIME_RUNTIME_DIR
          $overlayDir = Join-Path $env:GITHUB_WORKSPACE "build\\rime_overlay\\share"
          if (-not $runtimeDir) {
            $runtimeDir = Join-Path $env:GITHUB_WORKSPACE "build\\rime_runtime"
          }
          & $precompileExe.FullName --output-dir $prebuiltRoot --runtime-dir $runtimeDir --overlay-dir $overlayDir

      - name: Verify Rime dictionaries
        run: |
          $prebuilt = Join-Path $env:GITHUB_WORKSPACE "build\\rime_prebuilt\\user"
          if (-not (Test-Path $prebuilt)) {
            throw "rime prebuilt not found: $prebuilt"
          }
          if (-not (Get-ChildItem -Path $prebuilt -Recurse -File | Select-Object -First 1)) {
            throw "rime prebuilt empty: $prebuilt"
          }
          $share = Join-Path $env:GITHUB_WORKSPACE "build\\rime_overlay\\share"
          if (-not (Test-Path $share)) {
            throw "rime overlay share not found: $share"
          }
          if (-not (Get-ChildItem -Path $share -Recurse -File | Select-Object -First 1)) {
            throw "rime overlay share empty: $share"
          }

      - name: Build client
        run: cmake --build build/client --config Release --target mi_e2ee_client_ui_app mi_e2ee_client_ui mi_e2ee_launcher mi_ime_rime mi_e2ee_client_sdk

      - name: Build client e2e test
        if: env.MI_E2EE_CI_SKIP_E2E != '1'
        run: cmake --build build/client --config Release --target sdk_c_api_e2e_test

      - name: Run client e2e test
        if: env.MI_E2EE_CI_SKIP_E2E != '1'
        env:
          MI_E2EE_HARDENING: off
        run: ctest --test-dir build/client -C Release -R sdk_c_api_e2e_test --output-on-failure

      - name: Build Rust bindings
        run: |
          $env:MI_E2EE_CLIENT_LIB_DIR = Join-Path $env:GITHUB_WORKSPACE "build\\client\\Release"
          cargo build --manifest-path bindings/rust/Cargo.toml --examples

      - name: Python binding smoke
        run: |
          $env:MI_E2EE_CLIENT_DLL = Join-Path $env:GITHUB_WORKSPACE "build\\client\\Release\\mi_e2ee_client_sdk.dll"
          python bindings\\python\\test_smoke.py

      - name: Rust binding smoke
        env:
          MI_E2EE_CLIENT_LIB_DIR: ${{ github.workspace }}\build\client\Release
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\\build\\client\\Release;$env:PATH"
          cargo run --manifest-path bindings/rust/Cargo.toml --example smoke --quiet

      - name: Configure server
        run: >
          cmake -S server -B build/server
          -DMI_E2EE_ENABLE_MYSQL=ON
          -DMYSQL_INCLUDE_DIR="${{ env.MYSQL_INCLUDE_DIR }}"
          -DMYSQL_CLIENT_LIB="${{ env.MYSQL_CLIENT_LIB }}"
          -DBUILD_TESTING=ON
          -DMI_E2EE_PGO_INSTRUMENT=OFF
          -DMI_E2EE_ENABLE_LTO=OFF

      - name: Build server
        run: cmake --build build/server --config Release --target mi_e2ee_server mi_e2ee_server_launcher mi_e2ee_kt_keygen mi_e2ee_kt_pubinfo mi_e2ee_perf_baseline mi_e2ee_ops_health_view mi_e2ee_third_party_audit

      - name: Verify third-party lock
        run: |
          $tool = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "build\\server") -Recurse -Filter "mi_e2ee_third_party_audit.exe" | Select-Object -First 1
          if (-not $tool) {
            throw "mi_e2ee_third_party_audit.exe not found"
          }
          & $tool.FullName --lock "$env:GITHUB_WORKSPACE\\third_party\\third_party.lock" --verify

      - name: Build ops health test
        run: cmake --build build/server --config Release --target ops_health_test

      - name: Run ops health test
        run: ctest --test-dir build/server -C Release -R ops_health_test --output-on-failure

      - name: Ops health end-to-end
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:GITHUB_WORKSPACE "build\\ops_health_runtime"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $offline = Join-Path $work "offline"
          New-Item -ItemType Directory -Force -Path $offline | Out-Null
          $testUsers = Join-Path $work "test_user.txt"
          "u:p" | Out-File -FilePath $testUsers -Encoding ascii
          $ktKeygen = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "build\\server") -Recurse -Filter "mi_e2ee_kt_keygen.exe" | Select-Object -First 1
          if (-not $ktKeygen) {
            throw "mi_e2ee_kt_keygen.exe not found"
          }
          & $ktKeygen.FullName --out-dir $work --force | Out-Null
          $ktKey = Join-Path $work "kt_signing_key.bin"
          $pfxPath = Join-Path $work "mi_e2ee_server.pfx"
          $cert = New-SelfSignedCertificate `
            -DnsName @("localhost") `
            -CertStoreLocation "Cert:\\CurrentUser\\My"
          $pwd = New-Object System.Security.SecureString
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pwd | Out-Null
          $cert = Get-PfxCertificate -FilePath $pfxPath
          $serverFingerprint = [System.BitConverter]::ToString(
            [System.Security.Cryptography.SHA256]::Create().ComputeHash($cert.Export("Cert"))
          ).Replace("-", "").ToLower()
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $token = "abcdefghijklmnop"
          $config = @(
            "[mode]"
            "mode=1"
            "[server]"
            "list_port=$port"
            "offline_dir=$offline"
            "ops_enable=1"
            "ops_allow_remote=0"
            "ops_token=$token"
            "tls_enable=1"
            "require_tls=1"
            "tls_cert=$pfxPath"
            "key_protection=none"
            "kt_signing_key=$ktKey"
            "allow_legacy_login=0"
          ) -join "`n"
          $configPath = Join-Path $work "config.ini"
          $config | Out-File -FilePath $configPath -Encoding ascii
          $serverExe = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "build\\server") -Recurse -Filter "mi_e2ee_server.exe" | Select-Object -First 1
          if (-not $serverExe) {
            throw "mi_e2ee_server.exe not found"
          }
          $toolExe = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "build\\server") -Recurse -Filter "mi_e2ee_ops_health_view.exe" | Select-Object -First 1
          if (-not $toolExe) {
            throw "mi_e2ee_ops_health_view.exe not found"
          }
          $env:MI_E2EE_HARDENING = "off"
          $proc = Start-Process -FilePath $serverExe.FullName -ArgumentList @("config.ini") -WorkingDirectory $work -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              & $toolExe.FullName --host 127.0.0.1 --port $port --token $token --tls --tls-pinned-fingerprint $serverFingerprint --tls-no-verify-peer 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) {
                $ok = $true
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ok) {
              throw "ops health e2e failed"
            }
          } finally {
            if ($proc -and !$proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Perf baseline
        run: >
          .\\build\\server\\tools\\Release\\mi_e2ee_perf_baseline.exe --quick
          --min-frame-encode-ops $env:MI_E2EE_PERF_MIN_FRAME_ENCODE_OPS
          --min-frame-decode-ops $env:MI_E2EE_PERF_MIN_FRAME_DECODE_OPS
          --min-offline-put-mbps $env:MI_E2EE_PERF_MIN_OFFLINE_PUT_MBPS
          --min-offline-fetch-mbps $env:MI_E2EE_PERF_MIN_OFFLINE_FETCH_MBPS

      - name: Deploy Qt runtime
        run: |
          $qtRoot = "${{ steps.qt.outputs.qt-path }}"
          if (-not $qtRoot) {
            $qtRoot = $env:QT_ROOT_DIR
          }
          if (-not $qtRoot) {
            throw "Qt root dir not found"
          }
          $qtBin = Join-Path $qtRoot "bin"
          & (Join-Path $qtBin "windeployqt.exe") --release --compiler-runtime --qmldir $env:GITHUB_WORKSPACE\\client\\ui $env:GITHUB_WORKSPACE\\build\\client\\ui\\Release\\mi_e2ee_client_ui_app.exe
          $uiRoot = Join-Path $env:GITHUB_WORKSPACE "build\\client\\ui\\Release"
          $qmlRoot = Join-Path $uiRoot "qml"
          $qtQmlCoreDll = Join-Path $qtBin "Qt6QmlCore.dll"
          if (Test-Path $qtQmlCoreDll) {
            Copy-Item $qtQmlCoreDll $uiRoot -Force
          }
          $qtQmlCoreModule = Join-Path $qtRoot "qml\\QtCore"
          $dstQmlCoreModule = Join-Path $qmlRoot "QtCore"
          if ((Test-Path $qtQmlCoreModule) -and (-not (Test-Path $dstQmlCoreModule))) {
            New-Item -ItemType Directory -Force -Path $qmlRoot | Out-Null
            Copy-Item $qtQmlCoreModule $dstQmlCoreModule -Recurse -Force
          }

      - name: UI smoke regression
        env:
          MI_E2EE_UI_SMOKE: "1"
          MI_E2EE_UI_SMOKE_MS: "4000"
          MI_E2EE_UI_SMOKE_USER: "ui_smoke"
          MI_E2EE_UI_SMOKE_PASS: "ui_smoke_pass"
          MI_E2EE_UI_SMOKE_CAPTURE_DIR: ${{ github.workspace }}\build\ui_smoke_artifacts\build
          MI_E2EE_HARDENING: off
          QT_LOGGING_RULES: "*.debug=false;*.info=false"
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:GITHUB_WORKSPACE "build\\ui_smoke_runtime"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $dataDir = Join-Path $work "database"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $offline = Join-Path $work "offline"
          New-Item -ItemType Directory -Force -Path $offline | Out-Null
          $testUsers = Join-Path $work "test_user.txt"
          "ui_smoke:ui_smoke_pass" | Out-File -FilePath $testUsers -Encoding ascii
          $ktKeygen = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "build\\server") -Recurse -Filter "mi_e2ee_kt_keygen.exe" | Select-Object -First 1
          if (-not $ktKeygen) {
            throw "mi_e2ee_kt_keygen.exe not found"
          }
          & $ktKeygen.FullName --out-dir $work --force | Out-Null
          $ktKey = Join-Path $work "kt_signing_key.bin"
          $rootPub = Join-Path $work "kt_root_pub.bin"
          $trustStorePath = Join-Path $work "server_trust.ini"
          $pfxPath = Join-Path $work "mi_e2ee_server.pfx"
          $cert = New-SelfSignedCertificate `
            -DnsName @("localhost") `
            -CertStoreLocation "Cert:\\CurrentUser\\My"
          $pwd = New-Object System.Security.SecureString
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pwd | Out-Null
          $cert = Get-PfxCertificate -FilePath $pfxPath
          $serverFingerprint = [System.BitConverter]::ToString(
            [System.Security.Cryptography.SHA256]::Create().ComputeHash($cert.Export("Cert"))
          ).Replace("-", "").ToLower()
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $serverConfig = @(
            "[mode]"
            "mode=1"
            "[server]"
            "list_port=$port"
            "offline_dir=$offline"
            "debug_log=0"
            "tls_enable=1"
            "require_tls=1"
            "tls_cert=$pfxPath"
            "key_protection=none"
            "kt_signing_key=$ktKey"
            "allow_legacy_login=0"
          ) -join "`n"
          $serverConfigPath = Join-Path $work "config.ini"
          $serverConfig | Out-File -FilePath $serverConfigPath -Encoding ascii
          $clientConfig = @(
            "[client]"
            "server_ip=localhost"
            "server_port=$port"
            "use_tls=1"
            "require_tls=1"
            "trust_store=$trustStorePath"
            "require_pinned_fingerprint=1"
            "pinned_fingerprint=$serverFingerprint"
            "tls_verify_mode=pin"
            "tls_ca_bundle_path="
            "tls_verify_hostname=1"
            "auth_mode=opaque"
            "allow_legacy_login=0"
            "[traffic]"
            "cover_traffic_enabled=0"
            "[kt]"
            "require_signature=1"
            "root_pubkey_path=$rootPub"
            "[device_sync]"
            "enabled=0"
            "role=primary"
            "ratchet_enable=1"
          ) -join "`n"
          $clientConfigPath = Join-Path $work "client_config.ini"
          $clientConfig | Out-File -FilePath $clientConfigPath -Encoding ascii
          "" | Out-File -FilePath $trustStorePath -Encoding ascii
          $env:MI_E2EE_UI_SMOKE_CONFIG = $clientConfigPath
          $env:MI_E2EE_DATA_DIR = $dataDir
          New-Item -ItemType Directory -Force -Path $env:MI_E2EE_UI_SMOKE_CAPTURE_DIR | Out-Null
          $stdoutLog = Join-Path $env:MI_E2EE_UI_SMOKE_CAPTURE_DIR "stdout.log"
          $stderrLog = Join-Path $env:MI_E2EE_UI_SMOKE_CAPTURE_DIR "stderr.log"
          $serverExe = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "build\\server") -Recurse -Filter "mi_e2ee_server.exe" | Select-Object -First 1
          if (-not $serverExe) {
            throw "mi_e2ee_server.exe not found"
          }
          $exe = Get-ChildItem -Path $env:GITHUB_WORKSPACE\\build\\client\\ui\\Release -Filter "mi_e2ee_client_ui_app.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "mi_e2ee_client_ui_app.exe not found"
          }
          $proc = Start-Process -FilePath $serverExe.FullName -ArgumentList @("config.ini") -WorkingDirectory $work -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 25; $i++) {
              try {
                $tcp = New-Object System.Net.Sockets.TcpClient
                $tcp.Connect("127.0.0.1", $port)
                $tcp.Close()
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 200
              }
            }
            if (-not $ready) {
              throw "server not ready"
            }
            Push-Location $exe.Directory.FullName
            try {
              $uiProc = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.Directory.FullName -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
              if (-not $uiProc.WaitForExit(45000)) {
                if (Test-Path $stdoutLog) {
                  Get-Content $stdoutLog | Write-Host
                }
                if (Test-Path $stderrLog) {
                  Get-Content $stderrLog | Write-Host
                }
                Stop-Process -Id $uiProc.Id -Force -ErrorAction SilentlyContinue
                throw "UI smoke timed out after 45s"
              }
              if ($uiProc.ExitCode -ne 0) {
                if (Test-Path $stdoutLog) {
                  Get-Content $stdoutLog | Write-Host
                }
                if (Test-Path $stderrLog) {
                  Get-Content $stderrLog | Write-Host
                }
                throw "UI smoke failed with exit code $($uiProc.ExitCode)"
              }
            } finally {
              Pop-Location
            }
          } finally {
            if ($proc -and !$proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Package artifacts
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MI_E2EE_MYSQL_USERNAME)) {
            $env:MI_E2EE_MYSQL_USERNAME = "ci_pkg_" + [guid]::NewGuid().ToString("N").Substring(0, 12)
          }
          if ([string]::IsNullOrWhiteSpace($env:MI_E2EE_MYSQL_PASSWORD)) {
            $env:MI_E2EE_MYSQL_PASSWORD = "ci_pkg_pw_" + [guid]::NewGuid().ToString("N") + [guid]::NewGuid().ToString("N")
          }
          Write-Output "::add-mask::$($env:MI_E2EE_MYSQL_USERNAME)"
          Write-Output "::add-mask::$($env:MI_E2EE_MYSQL_PASSWORD)"
          try {
            .\\tools\\package_windows.ps1 -BuildConfig Release
          } finally {
            Remove-Item Env:MI_E2EE_MYSQL_USERNAME -ErrorAction SilentlyContinue
            Remove-Item Env:MI_E2EE_MYSQL_PASSWORD -ErrorAction SilentlyContinue
          }

      - name: Verify package
        run: .\\tools\\verify_package_windows.ps1

      - name: Ops health end-to-end (dist TLS)
        env:
          MI_E2EE_HARDENING: off
        run: |
          $ErrorActionPreference = "Stop"
          $serverRoot = Join-Path $env:GITHUB_WORKSPACE "dist\\mi_e2ee_server"
          $configDir = Join-Path $serverRoot "config"
          $offline = Join-Path $serverRoot "database\\offline_store"
          $captureDir = Join-Path $env:GITHUB_WORKSPACE "build\\ui_smoke_artifacts\\dist-ops"
          New-Item -ItemType Directory -Force -Path $offline | Out-Null
          New-Item -ItemType Directory -Force -Path $captureDir | Out-Null
          "u:p" | Out-File -FilePath (Join-Path $serverRoot "test_user.txt") -Encoding ascii
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $token = "abcdefghijklmnop"
          $metadataKeyHex = "00112233445566778899aabbccddeeff102132435465768798a9bacbdcedfe0f"
          $serverConfig = @(
            "[mode]"
            "mode=1"
            "[server]"
            "list_port=$port"
            "offline_dir=database/offline_store"
            "debug_log=0"
            "ops_enable=1"
            "ops_allow_remote=0"
            "ops_token=$token"
            "tls_enable=1"
            "require_tls=1"
            "tls_cert=config/mi_e2ee_server.pfx"
            "key_protection=none"
            "kt_signing_key=kt_signing_key.bin"
            "metadata_protection=none"
            "metadata_key_hex=$metadataKeyHex"
            "allow_legacy_login=0"
            "[kcp]"
            "enable=0"
            "allow_insecure=0"
          ) -join "`n"
          $serverConfig | Out-File -FilePath (Join-Path $configDir "config.ini") -Encoding ascii
          $serverFingerprint = [System.BitConverter]::ToString(
            [System.Security.Cryptography.SHA256]::Create().ComputeHash(
              (Get-PfxCertificate -FilePath (Join-Path $configDir "mi_e2ee_server.pfx")).Export("Cert")
            )
          ).Replace("-", "").ToLower()
          $serverLauncher = Join-Path $serverRoot "mi_e2ee_server.exe"
          $toolExe = Join-Path $serverRoot "tools\\mi_e2ee_ops_health_view.exe"
          $serverStdoutLog = Join-Path $captureDir "server-stdout.log"
          $serverStderrLog = Join-Path $captureDir "server-stderr.log"
          if (-not (Test-Path $serverLauncher)) {
            throw "dist server launcher missing: $serverLauncher"
          }
          if (-not (Test-Path $toolExe)) {
            throw "dist ops health tool missing: $toolExe"
          }
          $proc = Start-Process -FilePath $serverLauncher -WorkingDirectory $serverRoot -PassThru -WindowStyle Hidden -RedirectStandardOutput $serverStdoutLog -RedirectStandardError $serverStderrLog
          try {
            $ok = $false
            for ($i = 0; $i -lt 25; $i++) {
              & $toolExe --host 127.0.0.1 --port $port --token $token --tls --tls-pinned-fingerprint $serverFingerprint --tls-no-verify-peer 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) {
                $ok = $true
                break
              }
              if ($proc.HasExited) {
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ok) {
              if (Test-Path $serverStdoutLog) {
                Get-Content $serverStdoutLog | Write-Host
              }
              if (Test-Path $serverStderrLog) {
                Get-Content $serverStderrLog | Write-Host
              }
              throw "dist ops health e2e failed"
            }
          } finally {
            $child = Get-CimInstance Win32_Process -Filter "Name='mi_e2ee_server_app.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.ParentProcessId -eq $proc.Id } | Select-Object -First 1
            if ($child) {
              Stop-Process -Id $child.ProcessId -Force -ErrorAction SilentlyContinue
            }
            if ($proc -and !$proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: UI smoke regression (dist launcher TLS)
        env:
          MI_E2EE_UI_SMOKE: "1"
          MI_E2EE_UI_SMOKE_MS: "4000"
          MI_E2EE_UI_SMOKE_USER: "ui_smoke"
          MI_E2EE_UI_SMOKE_PASS: "ui_smoke_pass"
          MI_E2EE_UI_SMOKE_CAPTURE_DIR: ${{ github.workspace }}\build\ui_smoke_artifacts\dist
          MI_E2EE_HARDENING: off
          QT_LOGGING_RULES: "*.debug=false;*.info=false"
        run: |
          $ErrorActionPreference = "Stop"
          $serverRoot = Join-Path $env:GITHUB_WORKSPACE "dist\\mi_e2ee_server"
          $clientRoot = Join-Path $env:GITHUB_WORKSPACE "dist\\mi_e2ee_client"
          $serverConfigPath = Join-Path $serverRoot "config\\config.ini"
          $clientConfigPath = Join-Path $clientRoot "config\\client_config.ini"
          if (-not (Test-Path $clientConfigPath)) {
            throw "dist client config missing: $clientConfigPath"
          }
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $token = "abcdefghijklmnop"
          $metadataKeyHex = "00112233445566778899aabbccddeeff102132435465768798a9bacbdcedfe0f"
          $serverFingerprint = [System.BitConverter]::ToString(
            [System.Security.Cryptography.SHA256]::Create().ComputeHash(
              (Get-PfxCertificate -FilePath (Join-Path $serverRoot "config\\mi_e2ee_server.pfx")).Export("Cert")
            )
          ).Replace("-", "").ToLower()
          "ui_smoke:ui_smoke_pass" | Out-File -FilePath (Join-Path $serverRoot "test_user.txt") -Encoding ascii
          $serverConfig = @(
            "[mode]"
            "mode=1"
            "[server]"
            "list_port=$port"
            "offline_dir=database/offline_store"
            "debug_log=0"
            "ops_enable=1"
            "ops_allow_remote=0"
            "ops_token=$token"
            "tls_enable=1"
            "require_tls=1"
            "tls_cert=config/mi_e2ee_server.pfx"
            "key_protection=none"
            "kt_signing_key=kt_signing_key.bin"
            "metadata_protection=none"
            "metadata_key_hex=$metadataKeyHex"
            "allow_legacy_login=0"
            "[kcp]"
            "enable=0"
            "allow_insecure=0"
          ) -join "`n"
          $serverConfig | Out-File -FilePath $serverConfigPath -Encoding ascii
          $clientConfig = Get-Content $clientConfigPath
          $clientConfig = $clientConfig | ForEach-Object {
            if ($_ -match '^server_ip=') {
              "server_ip=127.0.0.1"
            } elseif ($_ -match '^server_port=') {
              "server_port=$port"
            } else {
              $_
            }
          }
          $clientConfig | Out-File -FilePath $clientConfigPath -Encoding ascii
          $env:MI_E2EE_UI_SMOKE_CONFIG = $clientConfigPath
          New-Item -ItemType Directory -Force -Path $env:MI_E2EE_UI_SMOKE_CAPTURE_DIR | Out-Null
          $stdoutLog = Join-Path $env:MI_E2EE_UI_SMOKE_CAPTURE_DIR "stdout.log"
          $stderrLog = Join-Path $env:MI_E2EE_UI_SMOKE_CAPTURE_DIR "stderr.log"
          $serverStdoutLog = Join-Path $env:MI_E2EE_UI_SMOKE_CAPTURE_DIR "server-stdout.log"
          $serverStderrLog = Join-Path $env:MI_E2EE_UI_SMOKE_CAPTURE_DIR "server-stderr.log"
          $serverLauncher = Join-Path $serverRoot "mi_e2ee_server.exe"
          $toolExe = Join-Path $serverRoot "tools\\mi_e2ee_ops_health_view.exe"
          $clientLauncher = Join-Path $clientRoot "mi_e2ee.exe"
          if (-not (Test-Path $serverLauncher)) {
            throw "dist server launcher missing: $serverLauncher"
          }
          if (-not (Test-Path $toolExe)) {
            throw "dist ops health tool missing: $toolExe"
          }
          if (-not (Test-Path $clientLauncher)) {
            throw "dist client launcher missing: $clientLauncher"
          }
          $proc = Start-Process -FilePath $serverLauncher -WorkingDirectory $serverRoot -PassThru -WindowStyle Hidden -RedirectStandardOutput $serverStdoutLog -RedirectStandardError $serverStderrLog
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              & $toolExe --host 127.0.0.1 --port $port --token $token --tls --tls-pinned-fingerprint $serverFingerprint --tls-no-verify-peer 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) {
                $ready = $true
                break
              }
              if ($proc.HasExited) {
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              if (Test-Path $serverStdoutLog) {
                Get-Content $serverStdoutLog | Write-Host
              }
              if (Test-Path $serverStderrLog) {
                Get-Content $serverStderrLog | Write-Host
              }
              throw "dist server not ready"
            }
            Push-Location $clientRoot
            try {
              $uiProc = Start-Process -FilePath $clientLauncher -WorkingDirectory $clientRoot -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
              if (-not $uiProc.WaitForExit(45000)) {
                if (Test-Path $stdoutLog) {
                  Get-Content $stdoutLog | Write-Host
                }
                if (Test-Path $stderrLog) {
                  Get-Content $stderrLog | Write-Host
                }
                Stop-Process -Id $uiProc.Id -Force -ErrorAction SilentlyContinue
                throw "dist UI smoke timed out after 45s"
              }
              if ($uiProc.ExitCode -ne 0) {
                if (Test-Path $stdoutLog) {
                  Get-Content $stdoutLog | Write-Host
                }
                if (Test-Path $stderrLog) {
                  Get-Content $stderrLog | Write-Host
                }
                throw "dist UI smoke failed with exit code $($uiProc.ExitCode)"
              }
            } finally {
              Pop-Location
            }
          } finally {
            $child = Get-CimInstance Win32_Process -Filter "Name='mi_e2ee_server_app.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.ParentProcessId -eq $proc.Id } | Select-Object -First 1
            if ($child) {
              Stop-Process -Id $child.ProcessId -Force -ErrorAction SilentlyContinue
            }
            if ($proc -and !$proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Perf baseline (dist)
        run: >
          .\\dist\\mi_e2ee_server\\tools\\mi_e2ee_perf_baseline.exe --quick
          --min-frame-encode-ops $env:MI_E2EE_PERF_MIN_FRAME_ENCODE_OPS
          --min-frame-decode-ops $env:MI_E2EE_PERF_MIN_FRAME_DECODE_OPS
          --min-offline-put-mbps $env:MI_E2EE_PERF_MIN_OFFLINE_PUT_MBPS
          --min-offline-fetch-mbps $env:MI_E2EE_PERF_MIN_OFFLINE_FETCH_MBPS

      - name: Upload UI smoke captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi_e2ee_windows_ui_smoke
          path: build/ui_smoke_artifacts/**/*

      - name: Upload client package
        uses: actions/upload-artifact@v4
        with:
          name: mi_e2ee_client
          path: dist/mi_e2ee_client.zip

      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: mi_e2ee_server
          path: dist/mi_e2ee_server.zip

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive

      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsecret-1-dev pkg-config openssl

      - name: Configure server
        run: cmake -S server -B build/server -DMI_E2EE_ENABLE_MYSQL=OFF -DBUILD_TESTING=ON

      - name: Build server
        run: cmake --build build/server --config Release

      - name: Build server tools
        run: >
          cmake --build build/server --config Release --target
          mi_e2ee_server
          mi_e2ee_kt_keygen
          mi_e2ee_kt_pubinfo
          mi_e2ee_perf_baseline
          mi_e2ee_ops_health_view
          mi_e2ee_third_party_audit

      - name: Verify third-party lock
        run: |
          set -euo pipefail
          tool=$(find "$GITHUB_WORKSPACE/build/server" -type f -name "mi_e2ee_third_party_audit" | head -n 1)
          if [ -z "$tool" ]; then
            echo "mi_e2ee_third_party_audit not found" >&2
            exit 1
          fi
          "$tool" --lock "$GITHUB_WORKSPACE/third_party/third_party.lock" --verify

      - name: Run server tests
        env:
          MI_E2EE_HARDENING: off
        run: ctest --test-dir build/server -C Release --output-on-failure

      - name: Ops health end-to-end
        env:
          MI_E2EE_HARDENING: off
        run: |
          set -euo pipefail
          work="$GITHUB_WORKSPACE/build/ops_health_runtime"
          rm -rf "$work"
          mkdir -p "$work/offline"
          printf "u:p\n" > "$work/test_user.txt"
          head -c 4032 /dev/urandom > "$work/kt_signing_key.bin"
          py="python3"
          if ! command -v "$py" >/dev/null 2>&1; then
            py="python"
          fi
          port=$("$py" -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          token="abcdefghijklmnop"
          printf '%s\n' \
            "[mode]" \
            "mode=1" \
            "[server]" \
            "list_port=$port" \
            "offline_dir=$work/offline" \
            "ops_enable=1" \
            "ops_allow_remote=0" \
            "ops_token=$token" \
            "debug_log=0" \
            "tls_enable=0" \
            "require_tls=0" \
            "key_protection=none" \
            "kt_signing_key=$work/kt_signing_key.bin" \
            "allow_legacy_login=0" \
            > "$work/config.ini"
          server=$(find "$GITHUB_WORKSPACE/build/server" -type f -name "mi_e2ee_server" -perm -111 | head -n 1)
          if [ -z "$server" ]; then
            echo "mi_e2ee_server not found" >&2
            exit 1
          fi
          tool=$(find "$GITHUB_WORKSPACE/build/server" -type f -name "mi_e2ee_ops_health_view" | head -n 1)
          if [ -z "$tool" ]; then
            echo "mi_e2ee_ops_health_view not found" >&2
            exit 1
          fi
          cd "$work"
          "$server" config.ini >/dev/null 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 20); do
            if "$tool" --host 127.0.0.1 --port "$port" --token "$token" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 0.5
          done
          kill "$pid" >/dev/null 2>&1 || true
          wait "$pid" >/dev/null 2>&1 || true
          if [ "$ok" -ne 1 ]; then
            echo "ops health e2e failed" >&2
            exit 1
          fi

      - name: Configure client
        run: cmake -S client -B build/client -DMI_E2EE_BUILD_UI=OFF -DMI_E2EE_BUILD_DEMO_CLIENT=OFF -DMI_E2EE_BUILD_LEGACY_UI=OFF -DMI_E2EE_ENABLE_MYSQL=OFF

      - name: Build client core
        run: cmake --build build/client --config Release --target mi_e2ee_client_core mi_e2ee_client_sdk

      - name: Build client e2e test
        if: env.MI_E2EE_CI_SKIP_E2E != '1'
        run: cmake --build build/client --config Release --target sdk_c_api_e2e_test

      - name: Run client e2e test
        if: env.MI_E2EE_CI_SKIP_E2E != '1'
        env:
          MI_E2EE_HARDENING: off
        run: ctest --test-dir build/client -R sdk_c_api_e2e_test --output-on-failure

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust bindings
        env:
          MI_E2EE_CLIENT_LIB_DIR: ${{ github.workspace }}/build/client
        run: cargo build --manifest-path bindings/rust/Cargo.toml --examples

      - name: Python binding smoke
        run: |
          set -euo pipefail
          lib_path=$(find "$GITHUB_WORKSPACE/build/client" -name "libmi_e2ee_client_sdk.so" -print -quit)
          if [ -z "$lib_path" ]; then
            echo "libmi_e2ee_client_sdk.so not found under build/client" >&2
            exit 1
          fi
          export MI_E2EE_CLIENT_DLL="$lib_path"
          python3 bindings/python/test_smoke.py

      - name: Rust binding smoke
        run: |
          set -euo pipefail
          lib_path=$(find "$GITHUB_WORKSPACE/build/client" -name "libmi_e2ee_client_sdk.so" -print -quit)
          if [ -z "$lib_path" ]; then
            echo "libmi_e2ee_client_sdk.so not found under build/client" >&2
            exit 1
          fi
          lib_dir=$(dirname "$lib_path")
          export MI_E2EE_CLIENT_LIB_DIR="$lib_dir"
          export LD_LIBRARY_PATH="$lib_dir:${LD_LIBRARY_PATH:-}"
          cargo run --manifest-path bindings/rust/Cargo.toml --example smoke --quiet

      - name: Package artifacts
        run: bash tools/package_posix.sh --platform linux

      - name: Verify package
        run: bash tools/verify_package_posix.sh --platform linux

      - name: Perf baseline
        run: |
          set -euo pipefail
          tool=$(find "$GITHUB_WORKSPACE/build/server" -type f -name "mi_e2ee_perf_baseline" | head -n 1)
          if [ -z "$tool" ]; then
            echo "mi_e2ee_perf_baseline not found under build/server" >&2
            exit 1
          fi
          "$tool" --quick \
            --min-frame-encode-ops "$MI_E2EE_PERF_MIN_FRAME_ENCODE_OPS" \
            --min-frame-decode-ops "$MI_E2EE_PERF_MIN_FRAME_DECODE_OPS" \
            --min-offline-put-mbps "$MI_E2EE_PERF_MIN_OFFLINE_PUT_MBPS" \
            --min-offline-fetch-mbps "$MI_E2EE_PERF_MIN_OFFLINE_FETCH_MBPS"

      - name: Perf baseline (dist)
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/dist/mi_e2ee_server/tools/mi_e2ee_perf_baseline"
          if [ ! -x "$tool" ]; then
            echo "dist perf baseline missing: $tool" >&2
            exit 1
          fi
          "$tool" --quick \
            --min-frame-encode-ops "$MI_E2EE_PERF_MIN_FRAME_ENCODE_OPS" \
            --min-frame-decode-ops "$MI_E2EE_PERF_MIN_FRAME_DECODE_OPS" \
            --min-offline-put-mbps "$MI_E2EE_PERF_MIN_OFFLINE_PUT_MBPS" \
            --min-offline-fetch-mbps "$MI_E2EE_PERF_MIN_OFFLINE_FETCH_MBPS"

      - name: Upload client package
        uses: actions/upload-artifact@v4
        with:
          name: mi_e2ee_client_linux
          path: dist/mi_e2ee_client_linux.tar.gz

      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: mi_e2ee_server_linux
          path: dist/mi_e2ee_server_linux.tar.gz

