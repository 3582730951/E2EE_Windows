            tools/ios_rootauth_smoke.swift \
            -o build/ios_rootauth_smoke
          build/ios_rootauth_smoke
          echo "smoke_verified=true" >> "$GITHUB_OUTPUT"

      - name: Capture RootAuth iOS screenshot
        if: always()
        run: |
