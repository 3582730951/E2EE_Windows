name: flutter-client

on:
  push:
    paths:
      - 'app_flutter/**'
      - '.github/workflows/flutter-client.yml'
  pull_request:
    paths:
      - 'app_flutter/**'
      - '.github/workflows/flutter-client.yml'
  workflow_dispatch:

concurrency:
  group: flutter-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Clear png outputs
        run: |
          mkdir -p pngs
          find pngs -maxdepth 1 -type f -name '*.png' -delete

      - name: Capture three-end UI pngs
        run: flutter test --dart-define=CAPTURE_PNGS=true --update-goldens test/ui_capture_test.dart

      - name: Widget Tests
        run: flutter test

      - name: Upload pngs artifact
        uses: actions/upload-artifact@v4
        with:
          name: app_flutter_pngs_${{ github.sha }}
          path: app_flutter/pngs/*.png
          if-no-files-found: error
